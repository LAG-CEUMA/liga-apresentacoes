<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Aulas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap"><link rel="stylesheet" href="/estilo.css"><link rel="stylesheet" href="/api/tema.css"></head>
<body data-pg="aulas"><main>
<div class="topo"><div><p class="tag">LIGA ACADÊMICA DE GAMES · CEUMA</p><h1>Aulas</h1></div><div class="acoes"><a class="btn sec" href="/">&larr; Início</a></div></div>
<p class="sub" style="color:var(--mut)">Escolha o nível para ver as aulas. Eles começam recolhidos.</p>
<div id="corpo"><p>Carregando…</p></div>
</main>
<script>
const NOME={owners:'só owners',membros:'membros',publico:'público'};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function secao(titulo,contagem){const d=el('details','nivel');const s=el('summary');s.append(el('span','nvt',titulo),el('span','nvc',contagem));d.append(s);return d}
fetch('/api/aulas',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{const C=document.getElementById('corpo');C.textContent='';
  if(!d.aulas.length){C.append(el('p','',d.usuario?'Nenhuma aula liberada para você ainda.':'Nenhuma aula pública no momento.'))}
  const por={};for(const a of d.aulas)(por[a.nivel]=por[a.nivel]||[]).push(a);
  for(const nv of Object.keys(por).sort()){const g=secao(nv,por[nv].length+' aula(s)');
    for(const a of por[nv]){const k=el('a','aula');k.href=a.url;const n=el('div');n.style.flex='1';n.append(el('b','',a.titulo),el('br'),el('small','',a.chave));k.append(n);if(a.acesso)k.append(el('span','badge',NOME[a.acesso]));g.append(k);
      if(a.roteiro){const r=el('a','aula');r.href=a.roteiro;r.style.marginLeft='32px';r.append(el('span','','Roteiro do apresentador (não projetar)'));g.append(r)}}
    C.append(g)}
  if(d.exigeLogin){const p=el('p','',`Há ${d.exigeLogin} aula(s) só para membros. `);const a=el('a','','Entre com o GitHub');a.href='/api/login';p.append(a,document.createTextNode(' para ver.'));C.append(p)}
}).catch(()=>{document.getElementById('corpo').textContent='Não consegui carregar. Recarregue a página.'});
</script></body></html>
