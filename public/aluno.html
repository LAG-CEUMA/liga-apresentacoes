<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Área do aluno</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap"><link rel="stylesheet" href="/estilo.css"><link rel="stylesheet" href="/api/tema.css"></head>

<div class="topo"><div><p class="tag">LIGA ACADÊMICA DE GAMES · CEUMA</p><h1>Área do aluno</h1></div><div class="acoes"><a class="btn sec" href="/">&larr; Início</a></div></div>

</main>
<script src="/novidade.js"></script><script src="/corrida.js"></script><script src="/ajuda.js"></script><script src="/ajuda-textos.js"></script>
<script>
const NOME={owners:'só owners',membros:'membros',publico:'público'};
const ST={presente:'Presente',ausente:'Falta',justificado:'Justificado','sem-chamada':'Sem chamada'};
const ES={prazo:'Entregue no prazo',atraso:'Entregue com atraso',nao:'Sem entrega registrada',dispensado:'Dispensado'};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function secao(titulo,contagem){const d=el('details','nivel');const s=el('summary');s.append(el('span','nvt',titulo),el('span','nvc',contagem));d.append(s);return d}
const fmt=p=>p?new Date(p).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';
let U=null,AULAS=null,ATIV=null,PONT=null,PRES=null,PERF=null,REPO=null,ABA='aulas';
const pendentes=()=>((ATIV&&ATIV.atividades)||[]).filter(x=>(!x.estado||x.estado==='nao')&&!x.respondida&&!x.opcional);
const j=u=>fetch(u,{credentials:'same-origin'}).then(r=>r.ok?r.json():null).catch(()=>null);

function tabResumo(C){
  const L=(ATIV&&ATIV.atividades)||[];
  const pend=pendentes().sort((a,b)=>(a.prazo?new Date(a.prazo).getTime():9e15)-(b.prazo?new Date(b.prazo).getTime():9e15));
  const esp=L.filter(x=>x.aguardando||(x.respondida&&typeof x.nota!=='number')).length;
  const feitas=L.filter(x=>typeof x.nota==='number').length;
  const opc=L.filter(x=>x.opcional&&(!x.estado||x.estado==='nao')&&!x.respondida).length;
  const t=PONT&&PONT.turmas&&(PONT.turmas.find(x=>x.status==='andamento')||PONT.turmas[0]);
  const ola=el('div','res-ola');ola.append(el('b','','Olá, @'+U+'!'),el('small','',t?t.nome:''));C.append(ola);
  // 1. o que fazer agora
  const g=el('div','res-card '+(pend.length?'res-fazer':'res-ok'));
  if(pend.length){g.append(el('h3','','Para fazer agora'));
    for(const x of pend.slice(0,3)){const venc=x.prazo&&new Date(x.prazo).getTime()<Date.now();const r=el('div','res-lin');const a=el('a','',(x.codigo?x.codigo+' · ':'')+x.titulo);a.href=x.issue||'#atividades';if(x.issue){a.target='_blank';a.rel='noopener'}r.append(a,el('small',venc?'res-venc':'',x.prazo?(venc?'prazo vencido em ':'até ')+fmt(x.prazo):'sem prazo'));g.append(r)}
    if(pend.length>3)g.append(el('small','res-mais','e mais '+(pend.length-3)+' em Atividades'));
  }else{g.append(el('h3','','✔ Tudo em dia'));g.append(el('p','sub',L.length?'Você não tem nenhuma atividade obrigatória pendente.'+(opc?' Há '+opc+' desafio'+(opc>1?'s':'')+' opcional'+(opc>1?'is':'')+' para pontos extras.':''):'Quando o professor liberar atividades, elas aparecem aqui.'))}
  C.append(g);
  // 2. números
  const n=el('div','res-num');
  const caixa=(v,r,aba)=>{const b=el('button','res-n');b.type='button';b.append(el('b','',String(v)),el('small','',r));b.onclick=()=>{ABA=aba;try{history.replaceState(null,'','#'+aba)}catch{}desenhar()};return b};
  n.append(caixa(pend.length,'a fazer','atividades'),caixa(esp,'aguardando correção','atividades'),caixa(feitas,'corrigidas','atividades'));
  if(t)n.append(caixa(t.total>0?t.posicao+'º':'—',t.total>0?'de '+t.de+' · '+t.total+' pts':'ranking','ranking'));
  C.append(n);
  C.append(el('p','sub','Aulas e slides estão em "Aulas". Sua presença e seus pontos estão em "Meu progresso".'));
}
function tabAulas(C){
  const d=AULAS;
  if(!d.aulas.length)C.append(el('p','sub',U?'Nenhuma aula liberada para você ainda.':'Nenhuma aula pública no momento.'));
  else C.append(el('p','sub','Escolha o nível para ver as aulas. Os níveis começam recolhidos e abrem sozinhos quando há aula nova.'));
  const por={};for(const a of d.aulas)(por[a.nivel]=por[a.nivel]||[]).push(a);
  for(const nv of Object.keys(por).sort()){const g=secao(nv,por[nv].length+' aula(s)');
    for(const a of por[nv]){const k=el('a','aula');k.href=a.url;const n=el('div');n.style.flex='1';n.append(el('b','',a.titulo),el('br'),el('small','',a.chave));k.append(n);if(a.acesso)k.append(el('span','badge',NOME[a.acesso]));g.append(k);
      if(a.roteiro){const r=el('a','aula');r.href=a.roteiro;r.style.marginLeft='32px';r.append(el('span','','Roteiro do apresentador (não projetar)'));g.append(r)}}
    C.append(g);LigaNovo.aplicar(g,'aulas-'+nv,por[nv].map(a=>a.chave).sort(),false)}
  if(d.exigeLogin){const p=el('p','',`Há ${d.exigeLogin} aula(s) só para membros. `);const a=el('a','','Entre com o GitHub');a.href='/api/login';p.append(a,document.createTextNode(' para ver.'));C.append(p)}
}
function tabAtiv(C){
  const L=(ATIV&&ATIV.atividades)||[];
  if(!L.length){const v=secao('Atividades','nenhuma liberada ainda');v.append(el('p','sub','Quando o professor liberar uma atividade (exercício ou tarefa), ela aparece aqui com prazo, peso e o link para responder no GitHub.'));C.append(v);v.open=true;return}
  const pend=L.filter(x=>(!x.estado||x.estado==='nao')&&!x.respondida),feitas=L.filter(x=>(x.estado&&x.estado!=='nao')||x.respondida);
  const agora=Date.now();
  const item=x=>{
    const ok=typeof x.nota==='number',resp=x.aguardando||x.respondida||(x.estado&&x.estado!=='nao'&&x.estado!=='dispensado'),disp=x.estado==='dispensado';
    const atrasoEnt=x.estado==='atraso'||(x.respondida&&x.respondidaAtraso);
    let cls,rot,sub;
    if(disp){cls='cz';rot='Dispensado';sub=''}
    else if(ok){cls='ok';rot='✔ Corrigida · nota '+x.nota;sub=atrasoEnt?'entregue com atraso':'entregue no prazo'}
    else if(resp){cls='esp';rot='⏳ Aguardando correção';sub=(x.respondidaEm?'respondida em '+fmt(x.respondidaEm)+' · ':'')+(atrasoEnt?'com atraso':'no prazo')}
    else if(x.prazo&&new Date(x.prazo).getTime()<agora){cls='atr';rot='Pendente · prazo vencido';sub='ainda dá para entregar'}
    else{cls='pen';rot='Pendente';sub=x.prazo?'até '+fmt(x.prazo):''}
    const i=el('div','atv '+cls);
    const top=el('div','atv-top');const tt=el('div','atv-tt');
    tt.append(el('b','',(x.codigo?x.codigo+' · ':'')+x.titulo),el('small','',[x.prazo&&(ok||resp)?'prazo '+fmt(x.prazo):'',x.opcional?'opcional · pontos extras':'peso '+x.peso].filter(Boolean).join(' · ')));
    const st=el('div','atv-st');st.append(el('span','atv-chip',rot));if(sub)st.append(el('small','',sub));
    top.append(tt,st);i.append(top);
    if(x.issue){const a=el('a',(ok||resp)?'atv-link':'btn atv-btn',(ok||resp)?'Ver minha resposta no GitHub':'Responder no GitHub');a.href=x.issue;a.target='_blank';a.rel='noopener';i.append(a)}
    else if(!ok&&!resp&&!disp)i.append(el('small','atv-sub','O link do GitHub aparece aqui assim que a atividade for enviada ao seu repositório.'));
    return i};
  const dica=el('p','sub','Responda comentando na Issue da atividade, no GitHub. Se aparecer "404", aceite o convite do seu repositório em github.com/LAG-CEUMA ou avise o monitor.');dica.style.cssText='margin:0 0 12px;font-size:13px';if(pend.length)C.append(dica);
  const a=secao('Pendentes',pend.length+(pend.length===1?' atividade':' atividades'));for(const x of pend)a.append(item(x));if(!pend.length)a.append(el('p','sub','Tudo em dia. Nenhuma pendência.'));C.append(a);LigaNovo.aplicar(a,'ativ-pend',pend.map(x=>x.id),true);
  const b=secao('Entregues',feitas.length+(feitas.length===1?' atividade':' atividades'));for(const x of feitas)b.append(item(x));if(!feitas.length)b.append(el('p','sub','Nada entregue ainda.'));C.append(b);LigaNovo.aplicar(b,'ativ-feitas',feitas.map(x=>x.id+x.estado+(x.respondida?'r':'')),false);
}
function tabProgresso(C){
  const m=PONT;
  if(!m||!m.turmas.length)C.append(el('p','sub','Você ainda não está em uma turma. Quando um owner ou monitor te cadastrar, sua pontuação aparece aqui.'));
  else{const s=secao('Minha pontuação',m.turmas.map(t=>t.total>0?`${t.nome}: ${t.total} pts · ${t.posicao}º de ${t.de}`:`${t.nome}: ainda sem pontos`).join(' | '));
    for(const t of m.turmas){const c=el('div','pont');
      const topo=el('div','pont-topo');const tt=el('div','');tt.append(el('b','',t.nome+(t.status==='arquivada'?' (encerrada)':'')),el('small','',t.total>0?`${t.posicao}º lugar de ${t.de}`:'Os pontos aparecem depois das primeiras aulas'));
      const n=el('div','pont-n',String(t.total));n.append(el('small','',' pts'));topo.append(tt,n);c.append(topo);
      const ch=el('div','pont-chips');for(const [nm,v] of [['Presença',t.partes.presenca],['Participação',t.partes.participacao],['Exercícios',t.partes.exercicios]])ch.append(el('span','pont-chip',nm+' '+v));
      if(t.partes.penalidades)ch.append(el('span','pont-chip pen','Penalidades −'+t.partes.penalidades));c.append(ch);
      if(t.aguardando)c.append(el('p','sub',t.aguardando+(t.aguardando===1?' atividade entregue está':' atividades entregues estão')+' aguardando correção. Os pontos entram assim que o professor der a nota.'));
      if(t.top5.length){c.append(el('div','pont-tit','Top 5 da turma'));const ol=el('div','pont-top');for(const x of t.top5){const eu=x.usuario===U;const l=el('div','pont-lin'+(eu?' eu':''));l.append(el('span','pont-pos',x.posicao+'º'),el('span','pont-nome','@'+x.usuario+(eu?' (você)':'')),el('span','pont-pts',x.total+' pts'));ol.append(l)}c.append(ol)}
      s.append(c)}
    C.append(s);LigaNovo.aplicar(s,'prog-pontos',m.turmas.map(t=>[t.turma,t.total,t.posicao]),true)}
  const p=PRES;
  if(p&&p.aluno){
    if(!p.sessoes.length){const v=secao('Minha presença','nenhuma aula registrada ainda');v.append(el('p','sub','Suas presenças e pontos de participação aparecem aqui depois da primeira chamada.'));C.append(v)}
    else{const ok=p.sessoes.filter(x=>x.status==='presente').length,pts=p.sessoes.reduce((t,x)=>t+x.pontos,0);const s=secao('Minha presença',`${ok} de ${p.sessoes.length} aula(s) · ${pts} ponto(s)`);
      for(const x of p.sessoes){const i=el('div','item');i.append(el('b','',x.titulo),el('br'),el('small','',`${x.data?x.data.split('-').reverse().join('/')+' · ':''}turma ${x.turma} · ${ST[x.status]||x.status} (${x.presencas}/${x.salvas} chamadas)${x.pontos?' · '+x.pontos+' ponto(s) de participação':''}`));
        for(const q of x.participacoes)i.append(el('br'),el('small','','• '+q.tipo+(q.nota?': '+q.nota:'')));s.append(i)}
      C.append(s);LigaNovo.aplicar(s,'prog-presenca',p.sessoes.map(x=>x.chave+x.status+x.pontos),false)}}
}
const fmtCpf=v=>{const d=String(v||'').replace(/\D/g,'');return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):String(v||'')};
function tabPerfil(C){
  const P=PERF;
  if(!P||!P.cadastrado){C.append(el('p','sub','Seu cadastro ainda não tem nome na Liga. Peça ao professor para cadastrar você; depois, aqui você completa seus contatos.'));return}
  const s=el('div','item');s.style.cssText='max-width:560px;display:block';
  s.append(el('b','',P.nome),el('br'),el('small','','GitHub: @'+P.usuario+' · para corrigir nome ou usuário, fale com o professor'));
  const campo=(rot,id,valor,ph,tipo,dicaKey)=>{const l=el('label','');l.style.cssText='display:block;margin-top:14px;font-size:13px';l.append(rot);const i=el('input','');i.type=tipo||'text';i.value=valor||'';i.placeholder=ph;i.id=id;i.style.cssText='display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:10px;background:#12141c;color:inherit;border:1px solid #fff3;border-radius:8px;font:inherit';if(window.dica)window.dica(i,dicaKey);l.append(i);return l};
  { const f=el('div','');f.style.cssText='margin-top:14px;padding:12px;border:1px solid #fff3;border-radius:10px';
    const topo=el('div','');topo.style.cssText='display:flex;gap:12px;align-items:center;flex-wrap:wrap';const prev=el('div','');prev.style.cssText='width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none';
    const atual=()=>{prev.textContent='';const a=Corrida.avatar(P.usuario);a.style.cssText='width:64px;height:64px;border-radius:50%;object-fit:cover';prev.append(a)};
    const msgF=el('small','');msgF.style.cssText='display:block;margin-top:8px;min-height:16px';
    const arq=el('input','');arq.type='file';arq.accept='image/*';arq.style.display='none';
    const env=el('button','btn sec','📷 Enviar foto');env.type='button';env.onclick=()=>arq.click();
    const rem=el('button','btn sec','Remover foto enviada');rem.type='button';rem.style.display=P.fotoModo==='upload'?'':'none';
    topo.append(prev,el('b','','Sua foto'),env,rem,arq);
    const r1=el('label','');r1.style.cssText='display:block;margin-top:10px;font-size:13px';const i1=el('input','');i1.type='radio';i1.name='pf_foto';i1.value='github';r1.append(i1,' Usar a foto do meu GitHub (padrão)');
    const r2=el('label','');r2.style.cssText='display:block;margin-top:6px;font-size:13px';const i2=el('input','');i2.type='radio';i2.name='pf_foto';i2.value='upload';r2.append(i2,' Usar a foto que enviei para a plataforma');
    const r3=el('label','');r3.style.cssText='display:block;margin-top:10px;font-size:13px';const i3=el('input','');i3.type='checkbox';i3.checked=!!P.fotoPublica;r3.append(i3,' Mostrar minha foto enviada também nas páginas públicas (ex.: destaques da página inicial). Desmarcado, só quem está logado na Liga vê.');
    const sync=()=>{i1.checked=P.fotoModo!=='upload';i2.checked=P.fotoModo==='upload';i2.disabled=P.fotoModo!=='upload'&&!P._enviou;r3.style.display=P.fotoModo==='upload'?'':'none';rem.style.display=P.fotoModo==='upload'?'':'none'};
    const post=async(c)=>{const r=await fetch('/api/presenca',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Erro');return d};
    const pref=async()=>{try{P.fotoModo=i2.checked?'upload':'github';P.fotoPublica=i3.checked;await post({acao:'minhafoto_pref',modo:P.fotoModo,publica:P.fotoPublica});msgF.textContent='Preferência salva.';sync();atual()}catch(e){msgF.textContent=e.message}};
    i1.onchange=pref;i2.onchange=pref;i3.onchange=pref;
    rem.onclick=async()=>{try{await post({acao:'minhafoto_remover'});P.fotoModo='github';P.fotoPublica=false;P._enviou=false;msgF.textContent='Foto removida: voltou a usar a do GitHub.';sync();atual()}catch(e){msgF.textContent=e.message}};
    arq.onchange=()=>{const fl=arq.files&&arq.files[0];if(!fl)return;msgF.textContent='Preparando a foto…';const im=new Image();const u=URL.createObjectURL(fl);im.onerror=()=>{msgF.textContent='Não consegui abrir essa imagem.'};
      im.onload=async()=>{try{const L=Math.min(im.width,im.height),sx=(im.width-L)/2,sy=(im.height-L)/2;const cv=document.createElement('canvas');cv.width=cv.height=256;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,256,256);g.drawImage(im,sx,sy,L,L,0,0,256,256);URL.revokeObjectURL(u);let q=.85,d=cv.toDataURL('image/jpeg',q);while(d.length*.75>70*1024&&q>.4){q-=.1;d=cv.toDataURL('image/jpeg',q)}
        await post({acao:'minhafoto',imagem:d,publica:i3.checked});P.fotoModo='upload';P._enviou=true;P.fotoPublica=i3.checked;msgF.textContent='Foto enviada e ativada.';sync();prev.textContent='';const a=el('img','');a.src=d;a.style.cssText='width:64px;height:64px;border-radius:50%;object-fit:cover';prev.append(a)}catch(e){msgF.textContent=e.message}};
      im.src=u};
    atual();sync();f.append(topo,r1,r2,r3,msgF,el('small','','A foto é reduzida no seu aparelho antes de enviar (fica bem leve). A do GitHub já é pública no próprio GitHub.'));s.append(f)}
  s.append(campo('E-mail institucional','pf_email',P.email,'a000000@ceuma.com.br','email','pf_email'),campo('E-mail pessoal','pf_pessoal',P.emailPessoal,'nome@gmail.com','email','pf_pessoal'),campo('CPF (obrigatório)','pf_cpf',fmtCpf(P.cpf),'000.000.000-00','text','pf_cpf'),campo('Curso ou profissão','pf_curso',P.curso,'Ex.: Engenharia de Software · Engenheiro de Computação','text','pf_curso'));
  const msg=el('small','');msg.style.cssText='display:block;margin-top:10px;min-height:18px';
  const b=el('button','btn','Salvar meus dados');b.type='button';b.style.marginTop='14px';
  b.onclick=async()=>{b.disabled=true;msg.textContent='Salvando…';try{const r=await fetch('/api/presenca',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'meuperfil',email:document.getElementById('pf_email').value,emailPessoal:document.getElementById('pf_pessoal').value,cpf:document.getElementById('pf_cpf').value,curso:document.getElementById('pf_curso').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Não consegui salvar agora.');Object.assign(P,d);document.getElementById('pf_email').value=d.email;document.getElementById('pf_pessoal').value=d.emailPessoal;document.getElementById('pf_curso').value=d.curso;document.getElementById('pf_cpf').value=fmtCpf(d.cpf);msg.textContent='Dados salvos. Obrigado!'}catch(e){msg.textContent=e.message}b.disabled=false};
  s.append(msg,b);C.append(el('p','sub','Mantenha seus contatos em dia: é por eles que a Liga avisa de aulas, eventos e certificados. Só a administração da Liga tem acesso a estes dados; o CPF identifica você de forma única (certificados e evitar cadastro duplicado) e não aparece para outros alunos.'),s)
}
function faixaRepo(C){
  if(!REPO)return;
  if(REPO.estado==='convite'){const b=el('div','item');b.style.cssText='border:2px solid #f5b83d;margin:0 0 14px;display:block';
    b.append(el('b','','Falta um passo: aceite o convite do seu repositório'),el('br'),el('small','','O GitHub convidou você para o repositório onde chegam suas atividades. Clique no botão, depois em "Accept invitation" (botão verde). Leva 10 segundos.'));
    const w=el('div','');w.style.marginTop='10px';const a=el('a','btn','Aceitar convite no GitHub');a.href=REPO.url;a.target='_blank';a.rel='noopener';w.append(a);b.append(w);C.append(b)}
  else if(REPO.estado==='sem-repo'){const b=el('div','item');b.style.cssText='margin:0 0 14px;display:block';b.append(el('b','','Seu repositório ainda não foi criado'),el('br'),el('small','','Avise o professor: ele cria na hora e você recebe o convite do GitHub.'));C.append(b)}
}

// ---------- Copa da Liga (camada divertida; nunca altera o ranking oficial nem as notas) ----------
let COPA=null,PREV=null,PREVT='';
async function postCopa(c){const r=await fetch('/api/presenca',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(c)});let b={};try{b=await r.json()}catch{}return{ok:r.ok,...b}}
function ateData(c){if(!c.inicio||!c.semana)return '';const d=new Date(new Date(c.inicio+'T00:00:00-03:00').getTime()+7*c.semana*864e5-1);return d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}
// Animação do resultado: o servidor já decidiu (d10); dado ou roleta é só a forma de mostrar. O aluno escolhe a que preferir.
const modoJogo=()=>'dado';
const rotuloJogo=()=>'🎲 Jogar';
const FCOR=['#7a0f1d','#d64545','#f0b429','#3fb36b','#ffd54a'];

    b.onclick=async()=>{const r=await jogar(b,()=>postCopa({acao:'copa_chefao',turma:PREVT,alvo:sel?sel.value:''}),(c.dadoChefao||{})[ch.tipo]);if(!r)return;desenhar()};
    if(sel)caixa.append(sel);caixa.append(b);if(ch.aleatorio&&d.alvo==='outro')caixa.append(el('small','','Monitor: o alvo é sorteado.'));if(ch.usado)caixa.append(el('small','','O Chefão já agiu nesta semana.'));else if(ch.tregua)caixa.append(el('small','','Trégua final.'));bx.append(caixa);{const ex=explicaDado((c.dadoChefao||{})[ch.tipo]);if(ex&&!ch.usado)bx.append(ex)}corpo.append(bx)}
  if(c.missao&&c.missao.vida!=null&&c.ativa)corpo.append(vidaChefao(c.missao));
  if(c.monitor)corpo.append(el('p','sub','Você entra como monitor: joga como Chefão com alvo sorteado, e só o dono vê o placar completo e configura a Copa.'));
  if(!c.ativa&&!c.monitor)corpo.append(el('p','','🔒 A Copa está desligada nesta turma. Para ligar: Presença › Ranking › 🏆 Copa (itens) › "Copa ativa nesta turma" › Salvar. Enquanto estiver desligada, os alunos veem esta aba como "ainda não foi aberta".'));
  else corpo.append(el('p','sub',`Copa ativa · visibilidade: ${{oculta:'escondida dos alunos',propria:'cada aluno vê só o próprio kart',completa:'pista completa'}[c.visibilidade]||c.visibilidade} · semana ${c.semana||0}.`+(c.evento?` ${c.evento.ic} ${c.evento.nome}.`:'')));
  if(c.placar&&c.placar.length){const nomeP=k=>nome(k);const linhas=c.placar.map(x=>({usuario:x.usuario,pontos:x.copa,posicao:x.posCopa,icones:x.escudo?[{ic:'🛡️',tx:'escudo ativo'}]:[]}));
    const max=Math.max(100,...c.placar.map(x=>x.copa));corpo.append(Corrida.pista({linhas,max,inicio:c.inicio,fim:c.fim,nome:nomeP,titulo:'COPA DA LIGA'}));
    const tb=el('div','');for(const x of c.placar){const inv=(c.inventario[x.usuario]||[]).map(i=>(c.itens[i.tipo]||{}).ic||'').join(' ');tb.append(el('p','sub',`${x.posCopa}º ${nome(x.usuario)} · ${x.copa} pts na Copa (oficial ${x.oficial})${x.efeito?` · efeito ${x.efeito>0?'+':''}${x.efeito}`:''} · itens: ${inv||'–'}${x.escudo?' 🛡️':''}`))}corpo.append(tb)}
}
function tabRanking(C){
  const m=PONT;if(PREV&&(!m||!m.turmas.length))return previa(C,'ranking');
  if(!m||!m.turmas.length){C.append(el('p','sub','Você ainda não está em uma turma.'));return}
  C.append(el('p','sub','🏆 Ranking oficial da turma: presença + participação + exercícios. Ele não muda com os itens da Copa. Cada degrau do pódio é um lugar; empatados ficam juntos.'));
  for(const t of m.turmas){const s=secao(t.nome+(t.status==='arquivada'?' (encerrada)':''),t.total>0?`você: ${t.posicao}º de ${t.de} · ${t.total} pts`:'ainda sem pontos');s.open=true;
    const lista=(t.top5||[]).map(x=>({usuario:x.usuario,pontos:x.total,posicao:x.posicao}));
    if(lista.length){const pod=Corrida.podioPlaces(lista,u=>'@'+u+(u===U?' (você)':''));if(pod)s.append(pod);
      const ol=el('div','pont-top');for(const x of lista.filter(x=>x.posicao>3)){const eu=x.usuario===U;const l=el('div','pont-lin'+(eu?' eu':''));l.append(el('span','pont-pos',x.posicao+'º'),el('span','pont-nome','@'+x.usuario+(eu?' (você)':'')),el('span','pont-pts',x.pontos+' pts'));ol.append(l)}s.append(ol)}
    else s.append(el('p','sub','Os pontos aparecem depois das primeiras aulas.'));
    const eu=el('div','pont');eu.append(el('b','',t.total>0?`Você: ${t.posicao}º lugar · ${t.total} pts`:'Você ainda não pontuou'),el('br'),el('small','',`Presença ${t.partes.presenca} · Participação ${t.partes.participacao} · Exercícios ${t.partes.exercicios}`+(t.partes.penalidades?` · Penalidades −${t.partes.penalidades}`:'')));s.append(eu);
    C.append(s)}
  C.append(el('p','sub','Quer ver os detalhes da sua presença e participação? Abra "Meu progresso". Quer jogar com itens? Abra "🏁 Copa".'))}
function desenhar(){
  const A=document.getElementById('abas');A.textContent='';const C=document.getElementById('corpo');C.textContent='';
  const abas=[];
  if(U)abas.push(['resumo','Resumo']);abas.push(['aulas','Aulas']);
  if(U){abas.push(['atividades','Atividades']);abas.push(['progresso','Meu progresso']);abas.push(['ranking','🏆 Ranking']);if(COPA||PREV)abas.push(['copa','🏁 Copa']);abas.push(['perfil','Meus dados'])}
  if(!abas.some(a=>a[0]===ABA))ABA=U?'resumo':'aulas';
  for(const [id,t] of abas){const b=el('button','btn'+(id===ABA?'':' sec'),t);b.type='button';b.onclick=()=>{ABA=id;try{history.replaceState(null,'','#'+id)}catch{}desenhar()};
    if(id==='atividades'&&ATIV&&pendentes().length){const n=el('span','novo',String(pendentes().length));b.append(n)}
    A.append(b)}
  A.append(ajuda('al_'+ABA));
  if(ABA!=='perfil')faixaRepo(C);
  if(ABA==='resumo')tabResumo(C);else if(ABA==='aulas')tabAulas(C);else if(ABA==='atividades')tabAtiv(C);else if(ABA==='perfil')tabPerfil(C);else if(ABA==='copa')tabCopa(C);else if(ABA==='ranking')tabRanking(C);else tabProgresso(C);
  // marca como visto para a faixa "novo" do menu da Início
  try{localStorage.setItem('liga_nv_menu',LigaNovo.sig([(AULAS.aulas||[]).map(a=>a.chave),((ATIV&&ATIV.atividades)||[]).map(x=>x.id)]))}catch{}
}
(async()=>{
  AULAS=await j('/api/aulas');if(!AULAS){document.getElementById('corpo').textContent='Não consegui carregar. Recarregue a página.';return}
  U=AULAS.usuario||null;
  if(U)[ATIV,PONT,PRES,PERF,REPO]=await Promise.all([j('/api/presenca?acao=minhasatividades'),j('/api/presenca?acao=minhapontuacao'),j('/api/presenca?acao=minha'),j('/api/presenca?acao=meuperfil'),j('/api/presenca?acao=meurepo')]);
  if(U&&PONT&&PONT.turmas){const t=PONT.turmas.find(x=>x.status==='andamento')||PONT.turmas[0];if(t){COPA=await j('/api/presenca?acao=copa&turma='+encodeURIComponent(t.turma));if(COPA&&COPA.erro)COPA=null}}
  if(U&&!(PONT&&PONT.turmas&&PONT.turmas.length)){const cx=await j('/api/presenca?acao=contexto');if(cx&&cx.turmas&&Object.keys(cx.turmas).length){PREV=cx;PREVT=Object.keys(cx.turmas).find(k=>cx.turmas[k].status==='andamento')||Object.keys(cx.turmas)[0]}}
  const h=location.hash.slice(1);if(['resumo','aulas','atividades','progresso','ranking','perfil','copa'].includes(h))ABA=h;else if(U)ABA='resumo';
  desenhar();
})();
