<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Chamada e presença</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap"><link rel="stylesheet" href="/estilo.css"><link rel="stylesheet" href="/api/tema.css"></head>
<body data-pg="painel"><main>
<div class="topo"><div><p class="tag" data-site="tag">CHAMADA E PRESENÇA</p><h1>Presença</h1></div><div class="acoes"><a class="btn sec" href="/">&larr; Início</a></div></div>
<p>Faça a chamada em <b>até 3 momentos</b> da aula (início, meio e fim). O que você marca fica como rascunho neste aparelho e <b>só vale quando clicar em "Salvar chamada"</b>. O aluno conta como presente se estiver em pelo menos metade das chamadas salvas.</p>
<div id="corpo"><p>Carregando…</p></div>
</main><div id="msg" class="msg" hidden></div>
<script src="/site.js"></script>
<script>
const $=id=>document.getElementById(id);
function h(t,p,...f){const e=document.createElement(t);for(const [k,v] of Object.entries(p||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k in e&&k!=='list')e[k]=v;else e.setAttribute(k,v)}
  for(const c of f.flat())if(c!==null&&c!==undefined&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
function aviso(t,erro){const m=$('msg');m.textContent=t;m.className='msg'+(erro?' erro':'');m.hidden=false;clearTimeout(aviso.t);aviso.t=setTimeout(()=>m.hidden=true,4000)}
async function api(corpo){const r=await fetch('/api/presenca',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Erro');return d}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let CTX,SESSAO=null,TURMA=ls.get('liga_turma','2026'),CHAVE=ls.get('liga_aula',''),DATA='',N=1,ESTADO={},ABA='chamada',PARTES=[];
const ROT=['Início','Meio','Fim'];
const chaveRasc=()=>`liga_rasc_${TURMA}_${CHAVE}_${N}`;
function hora(iso){try{return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch{return ''}}
async function carregarSessao(){
  SESSAO=null;if(!CHAVE)return;
  const r=await fetch(`/api/presenca?acao=sessao&turma=${encodeURIComponent(TURMA)}&chave=${encodeURIComponent(CHAVE)}`);
  if(!r.ok){const d=await r.json().catch(()=>({}));aviso(d.erro||'Não consegui carregar a aula.',1);return}
  const d=await r.json();SESSAO=d.sessao;CTX.roster=d.roster;if(SESSAO&&SESSAO.data)DATA=SESSAO.data;escolherChamada(N,false)}
function escolherChamada(n,redesenhar=true){N=n;let rasc=null;try{rasc=JSON.parse(ls.get(chaveRasc(),'null'))}catch{}
  const salva=SESSAO&&SESSAO.chamadas&&SESSAO.chamadas[n];ESTADO=rasc||(salva?{...salva.estados}:{});ESTADO.__rasc=!!rasc;if(redesenhar)desenhar()}
function rascunho(){const e={...ESTADO};delete e.__rasc;ls.set(chaveRasc(),JSON.stringify(e));ESTADO.__rasc=true}
function seletores(){
  const ids=Object.keys(CTX.turmas||{});if(ids.length&&!ids.includes(TURMA)){TURMA=ids.find(t=>CTX.turmas[t].status==='andamento')||ids[0];ls.set('liga_turma',TURMA)}
  const turma=h('select',{},...ids.map(t=>h('option',{value:t},CTX.turmas[t].nome)));turma.value=TURMA;turma.addEventListener('change',async()=>{TURMA=turma.value;ls.set('liga_turma',TURMA);await carregarSessao();desenhar()});
  const sel=h('select',{},h('option',{value:''},'Escolha a aula…'));const niveis={};const nvT=(CTX.turmas[TURMA]||{}).nivel;for(const a of CTX.aulas.filter(a=>!nvT||a.chave.startsWith(nvT+'/')))(niveis[a.nivel]=niveis[a.nivel]||[]).push(a);
  for(const nv of Object.keys(niveis).sort()){const g=h('optgroup',{label:nv});for(const a of niveis[nv])g.append(h('option',{value:a.chave},a.titulo));sel.append(g)}
  sel.value=CHAVE;sel.addEventListener('change',async()=>{CHAVE=sel.value;ls.set('liga_aula',CHAVE);N=1;await carregarSessao();desenhar()});
  const data=h('input',{type:'date',value:DATA||CTX.hoje});data.addEventListener('change',()=>{DATA=data.value});
  return h('div',{class:'linha'},h('label',{},'Turma ',turma),h('label',{style:'flex:1;min-width:220px'},'Aula ',sel),h('label',{},'Data ',data))}
function aba(){return h('div',{class:'tabs'},...[['chamada','Chamada'],['part','Participações'],['ent','Entregas'],['rank','Ranking'],['hist','Histórico']].map(([k,t])=>h('button',{type:'button',class:ABA===k?'on':'',onclick:()=>{ABA=k;desenhar()}},t)))}
function telaChamada(){
  if(!CHAVE)return h('p',{},'Escolha uma aula para começar.');
  if(!CTX.roster.length)return h('p',{},'Esta turma ainda não tem alunos. Um owner ou alguém com a permissão "Pessoas" cadastra os alunos no Painel.');
  const passos=h('div',{class:'passos'},...[1,2,3].map(n=>{const c=SESSAO&&SESSAO.chamadas&&SESSAO.chamadas[n];return h('button',{type:'button',class:N===n?'on':'',onclick:()=>escolherChamada(n)},h('b',{},`${n}. ${ROT[n-1]}`),h('small',{},c?`salva ${hora(c.em)} por ${c.por}`:'ainda não salva'))}));
  const cont=h('b',{});const conta=()=>{let p=0,a=0,j=0,s=0;for(const k of CTX.roster){const e=ESTADO[k];if(e==='p')p++;else if(e==='a')a++;else if(e==='j')j++;else s++}cont.textContent=`Presentes ${p} · Faltas ${a} · Justificados ${j} · Sem marca ${s}`;return s};
  const lista=h('div',{});
  for(const k of CTX.roster){const seg=h('div',{class:'seg tri'});
    for(const [v,t] of [['p','Presente'],['a','Falta'],['j','Justificado']]){const b=h('button',{type:'button',class:ESTADO[k]===v?'on '+v:''},t);
      b.addEventListener('click',()=>{ESTADO[k]=ESTADO[k]===v?undefined:v;rascunho();seg.querySelectorAll('button').forEach((x,i)=>x.className=ESTADO[k]===['p','a','j'][i]?'on '+['p','a','j'][i]:'');conta();aviso2()});seg.append(b)}
    lista.append(h('div',{class:'linha'},h('div',{class:'t'},h('b',{},k)),seg))}
  const rasc=h('small',{style:'color:var(--ouro)'});const aviso2=()=>{rasc.textContent=ESTADO.__rasc?'Rascunho neste aparelho: ainda não foi salvo.':''};aviso2();
  const salvar=h('button',{class:'btn',type:'button',onclick:async()=>{const sem=conta();
    if(sem&&!confirm(`${sem} aluno(s) estão sem marca e serão salvos como FALTA. Salvar a chamada ${N} (${ROT[N-1]})?`))return;
    if(!sem&&!confirm(`Salvar a chamada ${N} (${ROT[N-1]})?`))return;
    salvar.disabled=true;try{const e={...ESTADO};delete e.__rasc;const r=await api({acao:'chamada',turma:TURMA,chave:CHAVE,data:DATA||CTX.hoje,n:N,estados:e});ls.del(chaveRasc());aviso(`Chamada ${N} salva: ${r.presentes} presentes, ${r.ausentes} faltas, ${r.justificados} justificados`);await carregarSessao();desenhar()}catch(x){aviso(x.message,1)}salvar.disabled=false}},`Salvar chamada ${N}`);
  conta();
  return h('div',{},passos,h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px'},
    h('button',{class:'btn sec',type:'button',onclick:()=>{for(const k of CTX.roster)ESTADO[k]='p';rascunho();desenhar()}},'Todos presentes'),h('button',{class:'btn sec',type:'button',onclick:()=>{for(const k of CTX.roster)delete ESTADO[k];ls.del(chaveRasc());ESTADO.__rasc=false;desenhar()}},'Limpar'),cont,rasc),lista,h('div',{class:'barra'},rasc.cloneNode(true),h('span',{style:'flex:1'}),salvar))}
function telaPart(){
  if(!CHAVE)return h('p',{},'Escolha uma aula para registrar participações.');
  const aluno=h('select',{},...CTX.roster.map(k=>h('option',{value:k},k))),tipo=h('select',{},...Object.entries(CTX.tipos).map(([k,t])=>h('option',{value:k},t))),pts=h('input',{type:'number',min:0,max:10,value:1,style:'width:70px'}),nota=h('input',{type:'text',maxLength:140,placeholder:'nota curta (opcional)',style:'flex:1;min-width:160px'});
  const lista=h('div',{});const ps=(SESSAO&&SESSAO.participacoes)||[];
  if(!ps.length)lista.append(h('p',{},'Nenhuma participação registrada nesta aula.'));
  for(const p of ps)lista.append(h('div',{class:'linha'},h('div',{class:'t'},h('b',{},p.usuario),' · '+(CTX.tipos[p.tipo]||p.tipo)+' · '+p.pontos+' ponto(s)',h('br'),h('small',{},(p.nota||'')+' (por '+p.por+')')),
    h('button',{class:'btn sec',type:'button',onclick:async()=>{if(!confirm('Remover esta participação?'))return;try{await api({acao:'remover_participacao',turma:TURMA,chave:CHAVE,id:p.id});await carregarSessao();desenhar()}catch(e){aviso(e.message,1)}}},'Remover')));
  return h('div',{},h('div',{class:'linha'},aluno,tipo,h('label',{},'Pontos (se for penalidade, são os perdidos) ',pts),nota,h('button',{class:'btn',type:'button',onclick:async()=>{try{await api({acao:'participacao',turma:TURMA,chave:CHAVE,usuario:aluno.value,tipo:tipo.value,nota:nota.value,pontos:pts.value});aviso('Participação registrada');await carregarSessao();desenhar()}catch(e){aviso(e.message,1)}}},'Registrar')),
    h('p',{class:'sub'},'Os pontos entram no ranking da turma (aba Ranking). "Atrapalhou a aula" tira pontos do total do aluno.'),lista)}
function telaEntregas(){
  if(!CHAVE)return h('p',{},'Escolha uma aula para registrar as entregas da tarefa de casa.');
  if(!CTX.roster.length)return h('p',{},'Esta turma ainda não tem alunos.');
  const salvo=(SESSAO&&SESSAO.entregas)||{};const E={};for(const k of CTX.roster)E[k]={estado:(salvo[k]||{}).estado||'nao',nota:(salvo[k]||{}).nota===undefined?'':salvo[k].nota};
  const lista=h('div',{});
  for(const k of CTX.roster){const seg=h('div',{class:'seg tri'});const nota=h('input',{type:'number',min:0,max:10,step:0.5,placeholder:'nota 0–10',value:E[k].nota,style:'width:100px',oninput:e=>{E[k].nota=e.target.value}});
    const pinta=()=>seg.querySelectorAll('button').forEach((x,i)=>x.className=E[k].estado===['prazo','atraso','nao'][i]?'on '+['p','j','a'][i]:'');
    for(const [v,t] of [['prazo','No prazo'],['atraso','Atrasada'],['nao','Não entregou']]){const b=h('button',{type:'button'},t);b.addEventListener('click',()=>{E[k].estado=v;pinta()});seg.append(b)}pinta();
    lista.append(h('div',{class:'linha'},h('div',{class:'t'},h('b',{},k)),seg,nota))}
  const salvar=h('button',{class:'btn',type:'button',onclick:async()=>{if(!confirm('Salvar as entregas desta aula? Quem está como "Não entregou" fica com 0 nesta tarefa.'))return;salvar.disabled=true;try{const r=await api({acao:'entregas',turma:TURMA,chave:CHAVE,estados:E});aviso(`Entregas salvas: ${r.entregues} de ${CTX.roster.length}`);await carregarSessao();desenhar()}catch(x){aviso(x.message,1)}salvar.disabled=false}},'Salvar entregas');
  return h('div',{},h('p',{class:'sub'},'No prazo vale 100% do peso da tarefa, atrasada vale 50%, não entregou vale 0. A nota (opcional) multiplica: nota 8 em tarefa no prazo = 80%.'),lista,h('div',{class:'barra'},h('span',{style:'flex:1'}),salvar))}
async function telaRank(alvo){
  alvo.append(h('p',{},'Carregando…'));
  const r=await fetch('/api/presenca?acao=ranking&turma='+encodeURIComponent(TURMA));
  if(!r.ok){alvo.textContent='Não consegui carregar o ranking desta turma.';return}
  const R=await r.json();alvo.textContent='';const max=R.pesos.presenca+R.pesos.participacao+R.pesos.exercicios;
  alvo.append(h('p',{class:'sub'},`Pontuação máxima ${max}: presença ${R.pesos.presenca} + participação ${R.pesos.participacao} (meta ${R.config.meta} pontos) + exercícios ${R.pesos.exercicios}, menos penalidades. Empate: presença e depois exercícios.`));
  const tb=h('tbody',{});for(const x of R.ranking)tb.append(h('tr',{style:x.posicao<=5?'background:#f5b83d18':''},h('td',{},x.posicao+'º'),h('td',{},x.usuario),h('td',{},h('b',{},String(x.total))),h('td',{},String(x.partes.presenca)),h('td',{},String(x.partes.participacao)),h('td',{},String(x.partes.exercicios)),h('td',{style:x.partes.penalidades?'color:var(--err)':''},x.partes.penalidades?'−'+x.partes.penalidades:'0')));
  alvo.append(h('div',{class:'rolagem'},h('table',{class:'tabela'},h('thead',{},h('tr',{},...['#','Aluno','Total','Presença','Particip.','Exercícios','Penal.'].map(t=>h('th',{},t)))),tb)),h('p',{class:'sub'},'As linhas em destaque são o Top 5 da turma.'))}
let HIST=null;
async function telaHist(alvo){
  alvo.append(h('p',{},'Carregando…'));
  if(!HIST){const r=await fetch('/api/presenca?acao=historico');if(!r.ok){alvo.textContent='Não consegui carregar o histórico.';return}HIST=await r.json()}
  alvo.textContent='';const turmas=[...new Set(HIST.sessoes.map(s=>s.turma))].sort();
  if(!HIST.sessoes.length){alvo.append(h('p',{},'Ainda não há chamadas salvas.'));return}
  const filtro=h('select',{},h('option',{value:''},'Todas as turmas'),...turmas.map(t=>h('option',{value:t},t)));
  const corpo=h('div',{class:'rolagem'});
  const desenhaTab=()=>{corpo.textContent='';const ss=HIST.sessoes.filter(s=>!filtro.value||s.turma===filtro.value).sort((a,b)=>(a.data||'').localeCompare(b.data||'')||a.chave.localeCompare(b.chave));
    const nomes=new Set(HIST.roster);for(const s of ss)for(const k of Object.keys(s.resumo))nomes.add(k);
    const sim={presente:'P',ausente:'F',justificado:'J','sem-chamada':'–'};
    const tr=h('tr',{},h('th',{},'Aluno'),...ss.map(s=>h('th',{title:s.titulo+' · turma '+s.turma+' · '+s.chamadas+' chamada(s)'},(s.data||'').slice(5)||s.chave.split('/')[1])),h('th',{},'Presença'),h('th',{},'Pontos'));
    const tab=h('table',{class:'tabela'},h('thead',{},tr));const tb=h('tbody',{});
    for(const k of [...nomes].sort()){let ok=0,tot=0,pts=0;const tds=ss.map(s=>{const r=s.resumo[k];if(!r)return h('td',{class:'st-sem-chamada'},'–');tot++;if(r.status==='presente')ok++;pts+=r.pontos;return h('td',{class:'st-'+r.status},sim[r.status])});
      tb.append(h('tr',{},h('td',{},k),...tds,h('td',{},tot?Math.round(100*ok/tot)+'%':'–'),h('td',{},String(pts))))}
    tab.append(tb);corpo.append(tab)};
  filtro.addEventListener('change',desenhaTab);desenhaTab();
  const csv=()=>{const linhas=[['usuario','turma','aula','data','status','chamadas_presente','chamadas_salvas','pontos']];
    for(const s of HIST.sessoes)for(const [k,r] of Object.entries(s.resumo))linhas.push([k,s.turma,s.chave,s.data,r.status,r.presencas,r.salvas,r.pontos]);
    const txt=linhas.map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv'}));a.download='presenca.csv';a.click()};
  alvo.append(h('div',{class:'linha'},h('label',{},'Turma ',filtro),h('span',{style:'flex:1'}),h('button',{class:'btn sec',type:'button',onclick:csv},'Baixar CSV (Excel / Power BI)')),corpo,h('p',{class:'sub'},'P = presente, F = falta, J = justificado, – = sem registro. Presença = % das aulas com chamada em que o aluno foi considerado presente.'))}
function desenhar(){const c=$('corpo');c.textContent='';c.append(seletores(),aba());
  if(ABA==='chamada')c.append(telaChamada());else if(ABA==='part')c.append(telaPart());else if(ABA==='ent')c.append(telaEntregas());else if(ABA==='rank'){const d=h('div');c.append(d);telaRank(d)}else if(ABA==='hist'){const d=h('div');c.append(d);telaHist(d)}}
(async()=>{
  const r=await fetch('/api/presenca?acao=contexto');
  if(r.status===401){$('corpo').innerHTML='<p>Entre com o GitHub para fazer a chamada.</p><a class="btn" href="/api/login?next=/presenca">Entrar com GitHub</a>';return}
  if(r.status===403){$('corpo').innerHTML='<p>Você não tem permissão para fazer chamadas. Peça a um owner a permissão <b>Presença</b> (equipe) ou a liberação da sua aula (monitor).</p>';return}
  CTX=await r.json();if(!CTX.aulas.some(a=>a.chave===CHAVE))CHAVE=CTX.aulas.length===1?CTX.aulas[0].chave:'';DATA=CTX.hoje;{const ids=Object.keys(CTX.turmas||{});if(ids.length&&!ids.includes(TURMA))TURMA=ids.find(t=>CTX.turmas[t].status==='andamento')||ids[0]}
  await carregarSessao();desenhar()})().catch(()=>{$('corpo').textContent='Não consegui carregar. Recarregue a página.'});
</script></body></html>
