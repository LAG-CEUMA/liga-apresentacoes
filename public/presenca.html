<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Turma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap"><link rel="stylesheet" href="/estilo.css"><link rel="stylesheet" href="/api/tema.css"><style>.seletores{display:grid;grid-template-columns:minmax(150px,200px) 1fr 160px;gap:14px;align-items:end}.seletores label{display:flex;flex-direction:column;gap:5px;min-width:0}.seletores label>span{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut,#9aa0b4);font-weight:700}.seletores select,.seletores input{width:100%;box-sizing:border-box;padding:10px;background:#12141c;color:var(--txt);border:1px solid #fff3;border-radius:8px;font:inherit}.seletores select{text-overflow:ellipsis}@media(max-width:720px){.seletores{grid-template-columns:1fr}}

.ag{background:#171a26;border:1px solid #fff3;border-left:6px solid var(--ouro);border-radius:14px;margin:14px 0;padding:0 14px 6px}
.ag>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:16px 4px;font-size:20px;font-weight:800}
.ag>summary::-webkit-details-marker{display:none}.ag>summary::before{content:"▸";color:var(--ouro);font-size:22px}.ag[open]>summary::before{content:"▾"}
.ag>summary .cnt{margin-left:auto;font-size:13px;font-weight:600;background:#fff1;border-radius:99px;padding:4px 12px;color:var(--mut)}
.tg{border-radius:12px;margin:8px 0 12px;padding:0 10px 4px;border:1px solid #fff2;background:#12141c}
.tg.E{border-left:5px solid var(--ver)}.tg.T{border-left:5px solid #6aa7ff}.tg.O{border-left:5px solid var(--mut)}
.tg>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 2px;font-weight:700}
.tg>summary::-webkit-details-marker{display:none}.tg>summary::before{content:"▸";color:var(--mut)}.tg[open]>summary::before{content:"▾"}
.tg .letra{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-weight:900;color:#12141c}
.tg.E .letra{background:var(--ver)}.tg.T .letra{background:#6aa7ff}.tg.O .letra{background:var(--mut)}
.tg .expl{font-weight:500;color:var(--mut);font-size:13px}
.tg .linha{border-left:3px solid #fff2;margin-left:6px}
.leg{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.leg div{flex:1 1 260px;background:#171a26;border:1px solid #fff2;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle}
.pill.lib{background:#3ec9b033;color:var(--ver)}.pill.nao{background:#fff1;color:var(--mut)}.pill.opc{background:#f5b83d33;color:var(--ouro)}
.pz{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:middle;white-space:nowrap}
.pz.adi{background:#3ec9b033;color:var(--ver)}.pz.ok{background:#3ec9b022;color:#9be6d8}.pz.atr{background:#ff6b5b33;color:#ff8f82}.pz.perto{background:#f5b83d33;color:var(--ouro)}.pz.sem{background:#fff1;color:var(--mut)}
.st{display:inline-block;border-radius:8px;padding:2px 10px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:middle}
.st.acorrigir{background:var(--ouro);color:#12141c}.st.revisada{background:#ff9f43;color:#12141c}.chips .clic{cursor:pointer;transition:transform .12s,border-color .12s}.chips .clic:hover{border-color:#f7b93e;transform:translateY(-1px)}.chips .clic span::after{content:' ›'}.pisca{animation:pisca 1.6s ease}@keyframes pisca{0%,60%{box-shadow:0 0 0 3px #f7b93e}100%{box-shadow:none}}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-weight:700;font-size:13px;color:#0b0d14;position:relative}.dot sup{position:absolute;top:-6px;right:-6px;font-size:10px;color:#fff}.dot.verde{background:#2ecc71}.dot.azul{background:#4aa3ff}.dot.amar{background:#f7b93e}.dot.verm{background:#ff5d5d}.dot.cinza{background:#6b7285;color:#fff}.dot.traco{background:transparent;border:1px dashed #fff4;color:var(--mut)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:#171a26;border:1px solid #fff2;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13px}.legenda .lg{display:inline-flex;align-items:center;gap:6px;color:var(--mut)}.legenda .dot{width:20px;height:20px;font-size:11px}
.corr-wrap{border-radius:18px;overflow:hidden;border:1px solid #fff2}.corr-wrap svg{display:block;width:100%;height:auto}.corr-pista{position:relative;background:linear-gradient(#1b1f2d,#151826);border:1px solid #fff2;border-radius:14px;padding:10px 12px 10px 12px;overflow:hidden}
.corr-pista .faixa{position:absolute;top:0;bottom:0;right:0;width:22px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/11px 11px;opacity:.85}
.corr-pista .larg{position:absolute;top:0;bottom:0;left:56px;border-left:2px dashed #ffffff40}
.corr-via{position:relative;height:44px;border-bottom:1px dashed #ffffff18;margin-right:26px}
.corr-via:last-of-type{border-bottom:0}
.corr-kart{position:absolute;top:3px;display:flex;align-items:center;gap:6px;transition:left .6s;white-space:nowrap}
.corr-kart img,.corr-kart .ini{width:36px;height:36px;border-radius:50%;border:2px solid var(--ouro);object-fit:cover;background:#2a2e42;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none}
.corr-kart .rt{font-size:12px;color:#cfd3e6;background:#0008;border-radius:8px;padding:2px 7px}
.corr-pos{position:absolute;left:0;top:11px;width:44px;text-align:right;font-weight:800;font-size:13px;color:var(--mut)}
.corr-pod{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:8px 0 14px}
.corr-pod>div{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:13px;font-weight:700;max-width:150px}
.corr-pod img,.corr-pod .ini{width:56px;height:56px;border-radius:50%;border:3px solid var(--ouro);object-fit:cover;background:#2a2e42;display:flex;align-items:center;justify-content:center;font-weight:800}
.corr-pod .bloco{width:100px;border-radius:8px 8px 0 0;background:linear-gradient(#f5b83d,#c9871a);color:#10121a;display:flex;align-items:center;justify-content:center;font-size:22px;margin-top:6px}
table.acomp td.cel,table.acomp th.col{text-align:center}table.acomp th.col small{display:block;font-weight:400;color:var(--mut)}table.acomp td.sticky{position:sticky;left:0;background:#171a26;z-index:1;min-width:210px}table.acomp .mk{margin-left:6px}table.acomp td.nent{white-space:nowrap;font-size:14px;text-align:center}table.acomp a.nm{text-decoration:none;color:inherit}table.acomp tr.ficha td{background:#10131d;padding:10px}.st.verm{background:#ff5d5d33;color:#ff8a8a}.st.azul{background:#4aa3ff33;color:#8cc4ff}
.aviso-fora{display:inline-block;background:#ff9f4322;border:1px solid #ff9f43;border-radius:8px;padding:2px 8px;margin:2px 4px;font-size:12px}
table.acomp>thead>tr>th{position:sticky;top:0;z-index:4}table.acomp>thead>tr>th:first-child{z-index:6;left:0}.fichabox .barra{position:static}.fichabox th{position:static}table.acomp td.sticky{z-index:2}table.acomp .dot{z-index:0}.barra.livre{position:static;margin-top:10px}.pop{position:fixed;z-index:50;background:#1b1f2d;border:1px solid var(--ouro);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:230px;box-shadow:0 8px 30px #000a}.pop b{font-size:13px;padding:2px 6px}.pop .btn{text-align:left}
.aviso-nota{background:#ff9f4322;border:1px solid #ff9f43;border-left:6px solid #ff9f43;border-radius:12px;padding:12px 16px;margin:12px 0}.st.novamsg{background:#6aa7ff;color:#12141c}.st.corrigida{background:#3ec9b033;color:var(--ver)}.st.semresposta{background:#fff1;color:var(--mut)}.st.dispensado{background:#fff1;color:var(--mut)}.st.erro{background:#ff6b5b33;color:#ff8f82}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.chips div{flex:1 1 150px;background:#171a26;border:1px solid #fff2;border-radius:12px;padding:10px 14px}.chips b{display:block;font-size:28px;font-family:'Space Grotesk',sans-serif}.chips span{color:var(--mut);font-size:13px}
.bdg{display:inline-block;background:#ff6b5b;color:#fff;border-radius:99px;min-width:22px;padding:0 7px;margin-left:8px;font-size:13px;font-weight:800;line-height:22px;text-align:center}
.ag>summary{flex-wrap:wrap}.ag>summary>span:first-of-type{flex:1 1 240px}
.cr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 6px;border-top:1px solid #fff1}.cr .prev{flex-basis:100%;color:var(--mut);font-size:14px}
</style>
</head>
<body data-pg="painel"><main>
<div class="topo"><div><p class="tag" data-site="tag" id="tag-pg">TURMA</p><h1 id="tit-pg">Carregando…</h1></div><div class="acoes"><span id="cota-host"></span><a class="btn sec" href="/">&larr; Início</a></div></div>
<div id="intro"></div>
<div id="corpo"><p>Carregando…</p></div>
</main><div id="msg" class="msg" hidden></div>
<script src="/site.js"></script><script src="/corrida.js"></script><script src="/ajuda.js"></script>
<script>
window.AJUDA={
rank_copa_cfg:{t:'Configurar a Copa',l:['Copa ativa: liga o sistema de itens nesta turma. Os itens são entregues sozinhos toda semana a quem tem presença, participação e entrega no prazo.','Escondida: só você vê. Os alunos não percebem nada.','Cada aluno vê só o próprio kart: ele vê seus itens e a própria posição, sem ver os pontos dos colegas.','Pista completa: todos veem a pista e a pontuação da Copa de todos.','Itens e efeitos só afetam a Copa, nunca o ranking oficial nem as notas.']},
recuperacao:{t:'Sessão de recuperação',l:['Opcional. Um membro de destaque dá a aula de novo, em geral num sábado online, para quem perdeu ou entrou depois.','Quem participou fica marcado como presente na aula perdida, sem punição e com o prazo normal das atividades.','O ministrante ganha 2 pontos de participação (no máximo uma sessão pontuada por semana).','Se não houver sábado disponível, não precisa registrar nada.']},
rank_evento:{t:'Evento da semana',l:['Um modificador que vale só nesta semana: nevoeiro (placar escondido), dado em dobro, semana da paz (sem ataques) ou chuva de itens.','Escolha um ou deixe o sistema sortear. Você pode trocar ou tirar durante a semana.','A semana seguinte volta ao normal.']},
rank_chuva:{t:'Chuva de itens',l:['Dá 1 item extra sorteado a cada aluno da turma. Vale até o fim da semana e não conta no limite de 1 uso por semana.','Bom para premiar uma aula boa ou animar a turma.','Só 1 chuva por dia e não funciona na trégua final.']},
rank_itens:{t:'Itens da corrida',l:['Os itens aparecem ao lado do kart do aluno e nascem de fatos reais, nunca de sorteio.','🍄 Turbo: 2 ou mais entregas seguidas no prazo. Deixa um rastro de fogo na largada.','⭐ Estrela: entregou com 1 dia ou mais de folga.','🐢 Casco: foi o primeiro a entregar a atividade mais recente.','🎁 Caixa: presença completa.','🍌 Banana: o líder ainda tem atividade vencida sem entrega. É só um lembrete.','Itens nunca tiram nem dão pontos ou nota. São só visuais.','Passe o mouse sobre o kart para ver o motivo de cada item.']},
rank_corrida:{t:'Corrida da Liga',l:['Cada aluno é um kart com a foto do GitHub dele, num circuito. Cada volta é uma semana da turma (do início ao fim previstos). Quanto mais pontos no ranking (presença, participação e atividades), mais voltas ele já completou. O 🚓 (na linha de largada) é o ritmo ideal da semana atual: os karts à frente dele estão adiantados; os que estão antes da linha estão devendo. A distância na pista mostra o tamanho da diferença.','Os 3 primeiros aparecem no pódio. A pista é só para você por enquanto; depois você poderá escolher se os alunos veem.','Se a foto do GitHub não carregar, aparece a inicial do nome.','Em breve: turbo por entregar no prazo e troféus de constância.','Use a Tabela para ver o detalhe de cada parte da pontuação.']},
acomp_extras:{t:'Ordem, lembrete e planilha',l:['Ordem: muda a ordem dos alunos (alfabética, mais pendências, mais entregas ou maior média). Fica salva neste navegador.','Copiar lembrete dos pendentes: monta um texto pronto com as atividades vencidas e os nomes de quem falta, para você colar no grupo. O portal não envia nada sozinho.','Planilha (Excel): baixa um arquivo CSV com todos os alunos e o estado de cada atividade.','Média: soma das notas já dadas dividida pela soma das notas máximas dessas atividades. Atividades ainda sem nota não entram.','Novo: o aluno respondeu nas últimas 24 horas.']},
acomp_imagem:{t:'Imagem para o WhatsApp',l:['Cria uma imagem do quadro de entregas da turma, pronta para colar no grupo e estimular os alunos.','Motivacional: mostra o progresso da turma, os destaques e quem entregou, sem usar vermelho. Quem ainda não entregou aparece com um círculo vazio (dá tempo!). Completo: mostra também as atividades vencidas em vermelho e quantas faltam.','Por padrão aparece só o primeiro nome e a inicial do sobrenome. Marque Nome completo se quiser o nome todo.','Copiar imagem coloca a figura na área de transferência: abra o WhatsApp Web e cole com Ctrl+V. Se o navegador não permitir, use Baixar PNG e envie o arquivo.','Os números são os de agora, vindos do GitHub. Clique em Atualizar agora antes, se quiser o dado mais recente.']},
aba_acomp:{t:'Acompanhamento',l:['Quadro para acompanhar a turma inteira: uma linha por aluno e uma coluna por atividade. É só leitura: aqui você olha, e para dar nota usa a aba Correção.','Os dados vêm sozinhos das Atividades e do GitHub, então não há nada para digitar nem botão de salvar. A tela se atualiza sozinha.','Clique no nome de um aluno para abrir a ficha dele (pontos, situação em cada atividade e lembrete pronto). Clique numa bolinha para abrir um menu: ver a resposta no GitHub, ir corrigir aquela atividade ou abrir a ficha do aluno. Clique no código de uma atividade (cabeçalho da coluna) para abrir essa atividade na aba Correção.','Os números coloridos no alto são atalhos: clique para filtrar só aquele grupo.']},
acomp_legenda:{t:'Legenda das cores',l:['Verde ✓: entregou no prazo (ou adiantado) e já está corrigido.','Azul …: entregou e aguarda a sua correção. Nunca é vermelho: se a correção demora, o aluno não é prejudicado.','Amarelo !: entregou e foi corrigido, mas depois do prazo (vale 50%).','Vermelho ✕: o prazo já passou e não há resposta.','Cinza ·: ainda está dentro do prazo, sem resposta.','Traço –: dispensado ou a atividade não é para este aluno.','O símbolo ✉ pequeno na bolinha significa que o aluno escreveu de novo depois da correção.']},
acomp_filtro:{t:'Filtros e alertas',l:['Com pendência: tem ao menos uma atividade com prazo vencido e sem entrega (opcionais não contam).','Entregas atrasadas: respondeu depois do prazo em alguma atividade.','Aguardando correção: entregou e você ainda não deu a nota.','Sumido (alerta): tem atividade vencida e nunca respondeu nada, ou está há 14 dias ou mais sem responder qualquer coisa. Serve para você procurar o aluno antes que ele desista.']},
acomp_ficha:{t:'Ficha do aluno',l:['Mostra a posição e os pontos dele no ranking e a situação em cada atividade, com nota, prazo e a hora em que ele respondeu.','O botão Copiar lembrete monta uma mensagem pronta com as atividades pendentes. Você cola onde quiser; o portal não envia nada sozinho.']},
aba_chamada:{t:'Chamada',l:['Aqui você marca quem está na aula, em 2 momentos: Início e Fim.','Marque Presente, Falta ou Justificado. O que você marca fica como rascunho neste aparelho até clicar em Salvar chamada.','O aluno conta como presente se esteve em pelo menos metade das chamadas salvas. Com 2 chamadas, basta uma.','Quem ficar sem marca é salvo como Falta (o site pergunta antes).']},
aba_part:{t:'Participações',l:['Pontos extras ou descontos dados a um aluno durante a aula (ajuda, apresentação, penalidade).','Eles somam ou tiram pontos no ranking e no Meu progresso do aluno.']},
aba_corr:{t:'Correção',l:['Todas as respostas que os alunos devolveram no GitHub, numa tela só, sem precisar abrir atividade por atividade.','A corrigir: o aluno respondeu e você ainda não deu nota. Nova mensagem: o aluno escreveu de novo depois da sua correção (pode ser dúvida). Sem resposta: ainda não respondeu. Dúvidas avulsas: Issues que o próprio aluno abriu no repositório dele.','Ao lado de cada nome aparece o prazo: adiantado (entregou com dias de folga), no prazo, atrasado, ou quanto falta. Para quem respondeu, vale sempre a hora da resposta do aluno; corrigir depois do prazo não prejudica ninguém.','O número vermelho na aba é a quantidade de respostas esperando você. A tela se atualiza sozinha enquanto está aberta.']},
corr_fora:{t:'Resposta fora do lugar',l:['O aluno respondeu criando uma Issue nova ou uma sub-issue, em vez de comentar na Issue da atividade. O portal reconhece pelo título (código ou nome da atividade) e por estar dentro da atividade.','Contamos como resposta, com o prazo da hora em que ele postou, então ele não perde nota por isso.','O botão Avisar o aluno (ou Avisar todos, no topo) publica um texto padrão e educado na Issue da atividade explicando que a resposta deve ir num comentário. Só vai quando você clica e nunca repete para quem já foi avisado.','Se aparecer em Dúvidas avulsas com “pode ser resposta de…”, o texto não bateu com certeza: abra, confira e, se for resposta, dê a nota pela própria atividade.']},
corr_claude:{t:'Corrigir com Claude',l:['Copia o pedido de correção desta atividade e abre o Claude em outra aba.','Na conversa de código ligada ao projeto da Liga, cole (Ctrl+V) e envie. O Claude lê as respostas, propõe estado e nota numa tabela e só grava depois da sua aprovação.','Aparece só para owners. Cada owner usa o próprio Claude, na própria conta (precisa de acesso ao GitHub da Liga).']},
corr_lote:{t:'Corrigir vários de uma vez',l:['Mude o estado ou a nota de quantos alunos quiser. Cada mudança conta no botão Salvar alterações, e só então tudo é gravado junto.','Aplicar a todos os pendentes: escolha uma nota e clique. Ela é colocada em todos que estão A corrigir, Nova mensagem ou Fechada sem nota, mas só vale depois de Salvar alterações. Você ainda pode ajustar um por um antes de salvar.','Alunos sem nota ficam “aguardando correção” e ainda não pontuam. Se alguma nota estiver errada, nada é salvo e a tela diz qual aluno corrigir.']},
corr_estado:{t:'Estado e nota',l:['Já vem sugerido: No prazo ou Atrasada, conforme a hora do comentário do aluno. Mude se quiser.','A nota (opcional) multiplica os pontos. Salvar corrige só este aluno, sem mexer nos outros.']},
aba_ativ:{t:'Atividades',l:['Cada atividade tem peso, prazo e uma Issue por aluno no GitHub.','Liberar cria a Issue no repositório de cada aluno. O aluno responde comentando na Issue.','Depois use Respostas e notas para ver quem respondeu e dar a nota.']},
aba_rank:{t:'Ranking',l:['Soma presença, participação e atividades, por turma. Só entra quem já tem pontos.','Owners nunca aparecem no ranking. Monitores ficam de fora do ranking das turmas em que são monitores.','Para mostrar no Início do site, use Personalizar, seção Destaques.']},
aba_hist:{t:'Histórico',l:['Todas as chamadas já salvas, por turma e data.']},
est_prazo:{t:'No prazo',l:['Entregou até o prazo. Os pontos só entram quando você der a nota: antes disso o aluno vê “aguardando correção” e conta 0 por enquanto.']},
est_atraso:{t:'Atrasada',l:['Entregou depois do prazo. Vale 50% do peso (multiplicado pela nota, se houver).']},
est_nao:{t:'Não entregou',l:['Não respondeu. Vale 0 ponto nesta atividade.']},
est_dispensado:{t:'Dispensado',l:['Este aluno não faz esta atividade e ela não entra na conta dele (nem como 0).']},
pts_ativ:{t:'Pontos deste aluno',l:['Cálculo: peso × (100% no prazo, 50% atrasada, 0 não entregou) × (nota ÷ nota máxima). Sem nota ainda: 0 pontos por enquanto (aguardando correção).','É só uma prévia: o valor só vale depois de Salvar entregas.']},
f_codigo:{t:'Código',l:['Identifica e agrupa a atividade na lista. Padrão: nível, aula e tipo. Ex.: N0.1-2·E1.','E = exercício feito em sala; T = tarefa de casa.']},
f_titulo:{t:'Título',l:['Nome que o aluno vê na Issue e na Área do aluno.']},
f_peso:{t:'Peso',l:['Quanto a atividade vale nos pontos da turma, de 1 a 100. Quanto maior, mais importa no ranking.']},
f_notamax:{t:'Nota máxima',l:['A maior nota que você poderá dar nesta atividade (de 1 a 100; padrão 10). Ao corrigir, só aparecem as opções de 0 até esse valor, de 0,5 em 0,5.','Ex.: máximo 4: a nota 3 vale 75% do peso. Defina antes de corrigir.']},
f_prazo:{t:'Prazo',l:['Data e hora limite. Respostas depois dela são sugeridas como Atrasada (50% do peso). Para mudar todos de uma vez, use Adiar ou antecipar todos os prazos.']},
f_opcional:{t:'Opcional (pontos extras)',l:['Não entra no total da turma: só soma pontos extras para quem entregar.']},
f_desc:{t:'Texto da Issue',l:['O enunciado que o aluno recebe na Issue do repositório dele. Aceita Markdown (títulos, listas, **negrito**). Escreva o objetivo, o passo a passo e o que entregar.']},
adiar:{t:'Adiar ou antecipar prazos',l:['Muda os prazos de todas as atividades da turma de uma vez.','Número positivo adia (7 = uma semana depois). Negativo antecipa (-7). Use múltiplos de 7 para manter o dia da semana.']},

function itensCorrida(P,R){
  const out={};const add=(k,ic,t,tx)=>{(out[k]=out[k]||[]).push({ic,t,tx})};
  const nm=k=>quemTxt(k);
  const ativs=((P&&P.atividades)||[]).filter(a=>!a.opcional&&a.prazo).sort((x,y)=>x.prazo.localeCompare(y.prazo));
  const alunos=new Set();for(const a of ativs)for(const k of Object.keys(a.linhas))alunos.add(k);
  for(const k of alunos){let seq=0,estrela=null;
    for(const a of ativs){const l=a.linhas[k];if(!l)continue;const c=celAcomp(a,l,a.entregas[k]||{});if(c.c==='traco')continue;
      const feita=['verde','azul','amar'].includes(c.c);const noPrazo=feita&&c.c!=='amar'&&!c.atraso;
      if(noPrazo)seq++;else if(c.c==='verm'||feita)seq=0;
      if(noPrazo&&l.quando&&new Date(a.prazo).getTime()-new Date(l.quando).getTime()>=864e5)estrela=a}
    if(seq>=2)add(k,'🍄','Turbo','Entregou '+seq+' atividades seguidas no prazo');
    if(estrela)add(k,'⭐','Estrela','Entregou com folga (1 dia ou mais antes do prazo): '+(estrela.codigo||estrela.titulo))}
  // casco: primeiro a entregar a atividade mais recente que já tem entregas
  const comEnt=[...ativs].reverse().find(a=>Object.values(a.linhas).some(l=>l.respondeu&&l.quando));
  if(comEnt){const f=Object.entries(comEnt.linhas).filter(([,l])=>l.respondeu&&l.quando).sort((x,y)=>x[1].quando.localeCompare(y[1].quando))[0];if(f)add(f[0],'🐢','Casco','Foi o primeiro a entregar '+(comEnt.codigo||comEnt.titulo))}
  // presença completa = caixa surpresa
  for(const x of R.ranking)if(x.fPres>=1&&x.aulas>0)add(x.usuario,'🎁','Caixa','Presença completa em todas as aulas');
  // banana: lembrete gentil para o líder que ainda tem atividade vencida sem entrega
  const lider=R.ranking.find(x=>x.total>0);
  if(lider){let falta=0;for(const a of ativs){const l=a.linhas[lider.usuario];if(!l)continue;if(celAcomp(a,l,a.entregas[lider.usuario]||{}).c==='verm')falta++}

  return out}
