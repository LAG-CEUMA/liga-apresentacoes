let HIST=null;

    const nomes=new Set(HIST.roster);for(const s of ss)for(const k of Object.keys(s.resumo))nomes.add(k);

    const tr=h('tr',{},h('th',{},'Aluno'),...ss.map(s=>h('th',{title:s.titulo+' · turma '+s.turma+' · '+s.chamadas+' chamada(s)'},(s.data||'').slice(5)||s.chave.split('/')[1])),h('th',{},'Presença'),h('th',{},'Pontos'));
    const tab=h('table',{class:'tabela'},h('thead',{},tr));const tb=h('tbody',{});
    for(const k of [...nomes].sort()){let ok=0,tot=0,pts=0;const tds=ss.map(s=>{const r=s.resumo[k];if(!r)return h('td',{class:'st-sem-chamada'},'–');tot++;if(r.status==='presente')ok++;pts+=r.pontos;return h('td',{class:'st-'+r.status},sim[r.status])});
      tb.append(h('tr',{},h('td',{},k),...tds,h('td',{},tot?Math.round(100*ok/tot)+'%':'–'),h('td',{},String(pts))))}

    for(const s of HIST.sessoes)for(const [k,r] of Object.entries(s.resumo))linhas.push([k,s.turma,s.chave,s.data,r.status,r.presencas,r.salvas,r.pontos]);

  alvo.append(h('div',{class:'linha'},h('label',{},'Turma ',filtro),h('span',{style:'flex:1'}),h('button',{class:'btn sec',type:'button',onclick:csv},'Baixar CSV (Excel / Power BI)')),corpo,h('p',{class:'sub'},'P = presente, F = falta, J = justificado, – = sem registro. Presença = % das aulas com chamada em que o aluno foi considerado presente.'))}
