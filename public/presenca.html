<body data-pg="painel"><main>
<div class="topo"><div><p class="tag" data-site="tag">CHAMADA E PRESENÇA</p><h1>Presença</h1></div><div class="acoes"><a class="btn sec" href="/">&larr; Início</a></div></div>
<p>Faça a chamada em <b>2 momentos</b> da aula: <b>Início</b> e <b>Fim</b>. O que você marca fica como rascunho neste aparelho e <b>só vale quando clicar em "Salvar chamada"</b>. O aluno conta como presente se estiver em pelo menos metade das chamadas salvas.</p>
<div id="corpo"><p>Carregando…</p></div>
</main><div id="msg" class="msg" hidden></div>
<script src="/site.js"></script><script src="/ajuda.js"></script>
<script>
window.AJUDA={
aba_chamada:{t:'Chamada',l:['Aqui você marca quem está na aula, em 2 momentos: Início e Fim.','Marque Presente, Falta ou Justificado. O que você marca fica como rascunho neste aparelho até clicar em Salvar chamada.','O aluno conta como presente se esteve em pelo menos metade das chamadas salvas. Com 2 chamadas, basta uma.','Quem ficar sem marca é salvo como Falta (o site pergunta antes).']},
aba_part:{t:'Participações',l:['Pontos extras ou descontos dados a um aluno durante a aula (ajuda, apresentação, penalidade).','Eles somam ou tiram pontos no ranking e no Meu progresso do aluno.']},
aba_corr:{t:'Correção',l:['Todas as respostas que os alunos devolveram no GitHub, numa tela só, sem precisar abrir atividade por atividade.','A corrigir: o aluno respondeu e você ainda não deu nota. Nova mensagem: o aluno escreveu de novo depois da sua correção (pode ser dúvida). Sem resposta: ainda não respondeu. Dúvidas avulsas: Issues que o próprio aluno abriu no repositório dele.','Ao lado de cada nome aparece o prazo: adiantado (entregou com dias de folga), no prazo, atrasado, ou quanto falta.','O número vermelho na aba é a quantidade de respostas esperando você. A tela se atualiza sozinha enquanto está aberta.']},
corr_estado:{t:'Estado e nota',l:['Já vem sugerido: No prazo ou Atrasada, conforme a hora do comentário do aluno. Mude se quiser.','A nota (opcional) multiplica os pontos. Salvar corrige só este aluno, sem mexer nos outros.']},
aba_ent:{t:'Entregas (aba antiga)',l:['Marcação manual de uma tarefa única por aula. Não lê o GitHub.','Para exercícios e tarefas use a aba Atividades.']},
aba_ativ:{t:'Atividades',l:['Cada atividade tem peso, prazo e uma Issue por aluno no GitHub.','Liberar cria a Issue no repositório de cada aluno. O aluno responde comentando na Issue.','Depois use Respostas e notas para ver quem respondeu e dar a nota.']},
aba_rank:{t:'Ranking',l:['Soma presença, participação e atividades, por turma. Só entra quem já tem pontos.','Owners nunca aparecem no ranking. Monitores ficam de fora do ranking das turmas em que são monitores.','Para mostrar no Início do site, use Personalizar, seção Destaques.']},
aba_hist:{t:'Histórico',l:['Todas as chamadas já salvas, por turma e data.']},
est_prazo:{t:'No prazo',l:['Entregou até o prazo. Vale 100% do peso da atividade (multiplicado pela nota, se você der uma).']},
est_atraso:{t:'Atrasada',l:['Entregou depois do prazo. Vale 50% do peso (multiplicado pela nota, se houver).']},
est_nao:{t:'Não entregou',l:['Não respondeu. Vale 0 ponto nesta atividade.']},
est_dispensado:{t:'Dispensado',l:['Este aluno não faz esta atividade e ela não entra na conta dele (nem como 0).']},
pts_ativ:{t:'Pontos deste aluno',l:['Cálculo: peso × (100% no prazo, 50% atrasada, 0 não entregou) × (nota ÷ nota máxima).','É só uma prévia: o valor só vale depois de Salvar entregas.']},
f_codigo:{t:'Código',l:['Identifica e agrupa a atividade na lista. Padrão: nível, aula e tipo. Ex.: N0.1-2·E1.','E = exercício feito em sala; T = tarefa de casa.']},
f_titulo:{t:'Título',l:['Nome que o aluno vê na Issue e na Área do aluno.']},
f_peso:{t:'Peso',l:['Quanto a atividade vale nos pontos da turma, de 1 a 100. Quanto maior, mais importa no ranking.']},
f_notamax:{t:'Nota máxima',l:['A maior nota que você poderá dar nesta atividade (de 1 a 100; padrão 10). Ao corrigir, só aparecem as opções de 0 até esse valor, de 0,5 em 0,5.','Ex.: máximo 4: a nota 3 vale 75% do peso. Defina antes de corrigir.']},
f_prazo:{t:'Prazo',l:['Data e hora limite. Respostas depois dela são sugeridas como Atrasada (50% do peso). Para mudar todos de uma vez, use Adiar ou antecipar todos os prazos.']},
f_opcional:{t:'Opcional (pontos extras)',l:['Não entra no total da turma: só soma pontos extras para quem entregar.']},
f_desc:{t:'Texto da Issue',l:['O enunciado que o aluno recebe na Issue do repositório dele. Aceita Markdown (títulos, listas, **negrito**). Escreva o objetivo, o passo a passo e o que entregar.']},
adiar:{t:'Adiar ou antecipar prazos',l:['Muda os prazos de todas as atividades da turma de uma vez.','Número positivo adia (7 = uma semana depois). Negativo antecipa (-7). Use múltiplos de 7 para manter o dia da semana.']},
ativ_botoes:{t:'Botões da atividade',l:['Liberar a quem falta: cria a Issue para todo aluno que ainda não recebeu. Quem já tem não duplica.','Respostas e notas: mostra quem respondeu no GitHub, marca no prazo ou atrasada e permite dar a nota.','Liberar só alguns: escolha quais alunos recebem (aluno novo, reposição, reforço ou teste). Também tem o Recolher.','Editar: muda título, peso, prazo e o texto que vai na Issue.']},
resp:{t:'Respostas e notas',l:['As respostas do GitHub são buscadas sozinhas ao abrir. Quem comentou na Issue já vem marcado como No prazo ou Atrasada, comparando com o prazo.','Você revisa, digita a nota de 0 a 10 (opcional) e clica em Salvar entregas.','No prazo vale 100% do peso, atrasada 50%, não entregou 0. A nota multiplica.','Dispensado: o aluno não faz esta atividade e ela não conta para ele.']},
atualizar:{t:'Atualizar respostas do GitHub',l:['Busca de novo. Só precisa se um aluno comentou depois que você abriu esta tela (por exemplo, respondendo durante a aula).','Suas marcações ainda não salvas são mantidas. Só quem está como Não entregou recebe a sugestão.']},
salvar_entregas:{t:'Salvar entregas',l:['Grava as marcas e notas desta atividade. Elas entram nos pontos (ranking e Meu progresso).','Pode salvar várias vezes: salvar de novo substitui o anterior.','Atenção: quem está como Não entregou fica com 0. Nas tarefas de casa, salve depois do prazo.']},
lib:{t:'Liberar só alguns alunos',l:['Marque os alunos e clique em Liberar para os marcados. Serve para aluno que entrou depois, reposição, reforço ou teste.','Recolher: os alunos deixam de ver a atividade na plataforma (as Issues continuam no GitHub).','Copiar texto da Issue: copia o enunciado.']},
edit:{t:'Editar atividade',l:['Código (ex.: N0.1-2·E1: nível, aula, E de exercício ou T de tarefa), título, peso e prazo.','O texto vai em Markdown na Issue dos alunos. Mudar depois de liberada não reescreve as Issues que já foram criadas.']}
};
const $=id=>document.getElementById(id);
function h(t,p,...f){const e=document.createElement(t);for(const [k,v] of Object.entries(p||{})){if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k in e&&k!=='list')e[k]=v;else e.setAttribute(k,v)}
  for(const c of f.flat())if(c!==null&&c!==undefined&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
function aviso(t,erro){const m=$('msg');m.textContent=t;m.className='msg'+(erro?' erro':'');m.hidden=false;clearTimeout(aviso.t);aviso.t=setTimeout(()=>m.hidden=true,4000)}
async function api(corpo){const r=await fetch('/api/presenca',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(corpo)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||'Erro');return d}
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}},del(k){try{localStorage.removeItem(k)}catch{}}};
let CTX,SESSAO=null,TURMA=ls.get('liga_turma','2026'),CHAVE=ls.get('liga_aula',''),DATA='',N=1,ESTADO={},ABA='chamada',PARTES=[];
const ROT=['Início','Meio','Fim'];
const ord=(r)=>{const nm=(k)=>String(((CTX&&CTX.nomes)||{})[k]||k);return [...(r||[])].sort((a,b)=>nm(a).localeCompare(nm(b),'pt-BR',{sensitivity:'base'}))};
const quem=(k)=>{const n=((CTX&&CTX.nomes)||{})[k];return n?h('span',{},h('b',{},n),h('small',{class:'sub'},' @'+k)):h('b',{},k)};
const rot=(k)=>{const n=((CTX&&CTX.nomes)||{})[k];return n?n+' (@'+k+')':k};
const chaveRasc=()=>`liga_rasc_${TURMA}_${CHAVE}_${N}`;
function hora(iso){try{return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch{return ''}}
async function carregarSessao(){
  SESSAO=null;if(!CHAVE)return;
  const r=await fetch(`/api/presenca?acao=sessao&turma=${encodeURIComponent(TURMA)}&chave=${encodeURIComponent(CHAVE)}`);
  if(!r.ok){const d=await r.json().catch(()=>({}));aviso(d.erro||'Não consegui carregar a aula.',1);return}
  const d=await r.json();SESSAO=d.sessao;CTX.roster=ord(d.roster);if(SESSAO&&SESSAO.data)DATA=SESSAO.data;escolherChamada(N,false)}
function escolherChamada(n,redesenhar=true){N=n;let rasc=null;try{rasc=JSON.parse(ls.get(chaveRasc(),'null'))}catch{}
  const salva=SESSAO&&SESSAO.chamadas&&SESSAO.chamadas[n];ESTADO=rasc||(salva?{...salva.estados}:{});ESTADO.__rasc=!!rasc;if(redesenhar)desenhar()}
function rascunho(){const e={...ESTADO};delete e.__rasc;ls.set(chaveRasc(),JSON.stringify(e));ESTADO.__rasc=true}
function seletores(){
  const ids=Object.keys(CTX.turmas||{});if(ids.length&&!ids.includes(TURMA)){TURMA=ids.find(t=>CTX.turmas[t].status==='andamento')||ids[0];ls.set('liga_turma',TURMA)}
  const turma=h('select',{},...ids.map(t=>h('option',{value:t},CTX.turmas[t].nome)));turma.value=TURMA;turma.addEventListener('change',async()=>{TURMA=turma.value;ls.set('liga_turma',TURMA);await carregarSessao();desenhar()});
  const sel=h('select',{},h('option',{value:''},'Escolha a aula…'));const niveis={};const nvT=(CTX.turmas[TURMA]||{}).nivel;for(const a of CTX.aulas.filter(a=>!nvT||a.chave.startsWith(nvT+'/')))(niveis[a.nivel]=niveis[a.nivel]||[]).push(a);
  for(const nv of Object.keys(niveis).sort()){const g=h('optgroup',{label:nv});for(const a of niveis[nv])g.append(h('option',{value:a.chave},a.titulo));sel.append(g)}
  sel.value=CHAVE;sel.addEventListener('change',async()=>{CHAVE=sel.value;ls.set('liga_aula',CHAVE);N=1;await carregarSessao();desenhar()});
  const data=h('input',{type:'date',value:DATA||CTX.hoje});data.addEventListener('change',()=>{DATA=data.value});
  return h('div',{class:'linha seletores'},h('label',{},h('span',{},'Turma'),turma),h('label',{},h('span',{},'Aula'),sel),h('label',{},h('span',{},'Data'),data))}
function aba(){return h('div',{class:'tabs'},...[['chamada','Chamada'],['part','Participações'],['ent','Entregas'],['ativ','Atividades'],['corr','Correção'],['rank','Ranking'],['hist','Histórico']].map(([k,t])=>h('button',{type:'button','data-aba':k,class:ABA===k?'on':'',onclick:()=>{ABA=k;desenhar()}},t,k==='corr'&&BADGE>0?h('span',{class:'bdg'},String(BADGE)):'')),ajuda('aba_'+ABA))}
function telaChamada(){
  if(!CHAVE)return h('p',{},'Escolha uma aula para começar.');
  if(!CTX.roster.length)return h('p',{},'Esta turma ainda não tem alunos. Um owner ou alguém com a permissão "Pessoas" cadastra os alunos no Painel.');
  const passos=h('div',{class:'passos'},...[1,2,3].filter(n=>n!==2||(SESSAO&&SESSAO.chamadas&&SESSAO.chamadas[2])).map(n=>{const c=SESSAO&&SESSAO.chamadas&&SESSAO.chamadas[n];return h('button',{type:'button',class:N===n?'on':'',onclick:()=>escolherChamada(n)},h('b',{},ROT[n-1]),h('small',{},c?`salva ${hora(c.em)} por ${c.por}`:'ainda não salva'))}));
  const cont=h('b',{});const conta=()=>{let p=0,a=0,j=0,s=0;for(const k of CTX.roster){const e=ESTADO[k];if(e==='p')p++;else if(e==='a')a++;else if(e==='j')j++;else s++}cont.textContent=`Presentes ${p} · Faltas ${a} · Justificados ${j} · Sem marca ${s}`;return s};
  const lista=h('div',{});
  for(const k of CTX.roster){const seg=h('div',{class:'seg tri'});
    for(const [v,t] of [['p','Presente'],['a','Falta'],['j','Justificado']]){const b=h('button',{type:'button',class:ESTADO[k]===v?'on '+v:''},t);
      b.addEventListener('click',()=>{ESTADO[k]=ESTADO[k]===v?undefined:v;rascunho();seg.querySelectorAll('button').forEach((x,i)=>x.className=ESTADO[k]===['p','a','j'][i]?'on '+['p','a','j'][i]:'');conta();aviso2()});seg.append(b)}
    lista.append(h('div',{class:'linha'},h('div',{class:'t'},quem(k)),seg))}
  const rasc=h('small',{style:'color:var(--ouro)'});const aviso2=()=>{rasc.textContent=ESTADO.__rasc?'Rascunho neste aparelho: ainda não foi salvo.':''};aviso2();
  const salvar=h('button',{class:'btn',type:'button',onclick:async()=>{const sem=conta();
    if(sem&&!confirm(`${sem} aluno(s) estão sem marca e serão salvos como FALTA. Salvar a chamada do ${ROT[N-1]}?`))return;
    if(!sem&&!confirm(`Salvar a chamada do ${ROT[N-1]}?`))return;
    salvar.disabled=true;try{const e={...ESTADO};delete e.__rasc;const r=await api({acao:'chamada',turma:TURMA,chave:CHAVE,data:DATA||CTX.hoje,n:N,estados:e});ls.del(chaveRasc());aviso(`Chamada ${N} salva: ${r.presentes} presentes, ${r.ausentes} faltas, ${r.justificados} justificados`);await carregarSessao();desenhar()}catch(x){aviso(x.message,1)}salvar.disabled=false}},`Salvar chamada: ${ROT[N-1]}`);
  conta();
  return h('div',{},passos,h('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px'},
    h('button',{class:'btn sec',type:'button',onclick:()=>{for(const k of CTX.roster)ESTADO[k]='p';rascunho();desenhar()}},'Todos presentes'),h('button',{class:'btn sec',type:'button',onclick:()=>{for(const k of CTX.roster)delete ESTADO[k];ls.del(chaveRasc());ESTADO.__rasc=false;desenhar()}},'Limpar'),cont,rasc),lista,h('div',{class:'barra'},rasc.cloneNode(true),h('span',{style:'flex:1'}),salvar))}
function telaPart(){
  if(!CHAVE)return h('p',{},'Escolha uma aula para registrar participações.');
  const aluno=h('select',{},...CTX.roster.map(k=>h('option',{value:k},rot(k)))),tipo=h('select',{},...Object.entries(CTX.tipos).map(([k,t])=>h('option',{value:k},t))),pts=h('input',{type:'number',min:0,max:10,value:1,style:'width:70px'}),nota=h('input',{type:'text',maxLength:140,placeholder:'nota curta (opcional)',style:'flex:1;min-width:160px'});
  const lista=h('div',{});const ps=(SESSAO&&SESSAO.participacoes)||[];
  if(!ps.length)lista.append(h('p',{},'Nenhuma participação registrada nesta aula.'));
  for(const p of ps)lista.append(h('div',{class:'linha'},h('div',{class:'t'},h('b',{},p.usuario),' · '+(CTX.tipos[p.tipo]||p.tipo)+' · '+p.pontos+' ponto(s)',h('br'),h('small',{},(p.nota||'')+' (por '+p.por+')')),
    h('button',{class:'btn sec',type:'button',onclick:async()=>{if(!confirm('Remover esta participação?'))return;try{await api({acao:'remover_participacao',turma:TURMA,chave:CHAVE,id:p.id});await carregarSessao();desenhar()}catch(e){aviso(e.message,1)}}},'Remover')));
  return h('div',{},h('div',{class:'linha'},aluno,tipo,h('label',{},'Pontos (se for penalidade, são os perdidos) ',pts),nota,h('button',{class:'btn',type:'button',onclick:async()=>{try{await api({acao:'participacao',turma:TURMA,chave:CHAVE,usuario:aluno.value,tipo:tipo.value,nota:nota.value,pontos:pts.value});aviso('Participação registrada');await carregarSessao();desenhar()}catch(e){aviso(e.message,1)}}},'Registrar')),
    h('p',{class:'sub'},'Os pontos entram no ranking da turma (aba Ranking). "Atrapalhou a aula" tira pontos do total do aluno.'),lista)}
function telaEntregas(){
