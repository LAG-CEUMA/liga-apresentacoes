<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Liga de Games Ceuma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap"><link rel="stylesheet" href="/estilo.css"><link rel="stylesheet" href="/api/tema.css"></head>
<body data-pg="inicio"><main>
<div class="topo"><div><p class="tag" data-site="tag">LIGA ACADÊMICA DE GAMES · CEUMA</p><h1 id="titulo">Início</h1></div><div class="acoes" id="conta"></div></div>
<div id="hero" class="hero" hidden></div>
<nav class="atalhos" id="atalhos" aria-label="Atalhos" hidden></nav>
<div id="corpo"><p>Carregando…</p></div>
<div class="dica"><b>Dica da Liga:</b> use termos e programas em inglês. Tutoriais, pesquisas e IA falam de código em inglês.</div>
</main>
<script src="/site.js"></script><script src="/vitrine.js"></script>
<script>
const NOME={owners:'só owners',membros:'membros',publico:'público'};
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function secao(titulo,contagem,aberta){const d=el('details','nivel');d.open=aberta;const s=el('summary');s.append(el('span','nvt',titulo),el('span','nvc',contagem));d.append(s);return d}
function lembrar(d,chave,padrao){let a=padrao;try{const v=localStorage.getItem('liga_'+chave);if(v!==null)a=v==='1'}catch{}d.open=a;d.addEventListener('toggle',()=>{try{localStorage.setItem('liga_'+chave,d.open?'1':'0')}catch{}})}
function link(t,u){const a=el('a','',t);a.href=u;a.target='_blank';a.rel='noopener noreferrer';return a}
const BL={},PAD=['boasVindas','anuncios','agenda','vitrine','aulas','ativ','pontos','presenca'];let ORD={};
function porPeso(arr,fn,cls){const f=document.createDocumentFragment(),a=arr.slice().sort((x,y)=>(x.peso||0)-(y.peso||0));let i=0;while(i<a.length){let j=i;while(j<a.length&&a[j].peso===a[i].peso)j++;const r=el('div','cols c'+Math.min(j-i,3)+(cls?' '+cls:''));for(let k=i;k<j;k++)r.append(fn(a[k]));f.append(r);i=j}return f}
function organizar(){const c=document.getElementById('corpo');c.textContent='';const w=k=>ORD[k]||99,ks=PAD.filter(k=>BL[k]).sort((a,b)=>w(a)-w(b)||PAD.indexOf(a)-PAD.indexOf(b));let i=0;
  while(i<ks.length){let j=i;while(j<ks.length&&w(ks[j])===w(ks[i]))j++;const r=el('div','cols c'+Math.min(j-i,3));for(let k=i;k<j;k++)r.append(BL[ks[k]]);c.append(r);i=j}}
Promise.all([fetch('/api/aulas').then(r=>r.json()),window.LIGA_SITE]).then(([d,site])=>{
  const conta=document.getElementById('conta');
  if(d.usuario){conta.append(el('span','badge',`${d.usuario} · ${d.titulo||d.papel}`));const P=d.permissoes||[];
    const botoes=[[P.includes('aulas')||P.includes('pessoas'),'Painel','/admin'],[P.includes('site'),'Personalizar','/personalizar'],[P.includes('presenca')||d.papel==='monitor','Presença','/presenca'],[!!d.editor,'Editor de slides','/editor'],[['owner','monitor','equipe'].includes(d.papel),'Guias e dúvidas','/wiki'],[d.papel!=='visitante','Central de ajuda','/ajuda'],[true,'Eventos','/eventos']];
    for(const [ok,t,h] of botoes)if(ok){const a=el('a','btn sec',t);a.href=h;conta.append(a)}
    const s=el('a','btn sec','Sair');s.href='/api/logout';conta.append(s)}
  else{const a=el('a','btn','Entrar com GitHub');a.href='/api/login';conta.append(a)}
  ORD=site.ordem||{};const bv=site.boasVindas||{};
  if(bv.titulo||bv.texto){const h=document.getElementById('hero');h.hidden=false;if(bv.titulo)h.append(el('h2','',bv.titulo));if(bv.texto)h.append(el('p','',bv.texto));
    if(!d.usuario){const a=el('a','btn','Entrar com GitHub');a.href='/api/login';h.append(a)}BL.boasVindas=h}
  const c=document.getElementById('corpo');
  // anúncios
  const an=site.anuncios||[];
  if(an.length){const s=secao('Anúncios',an.length+(an.length===1?' aviso':' avisos'));s.id='sec-anuncios';lembrar(s,'anuncios',true);
    s.append(porPeso(an,a=>{const i=el('div','item');if(a.fixo)i.append(el('span','pin','FIXADO'));i.append(el('h3','',a.titulo));if(a.texto)i.append(el('p','',a.texto));
      if(a.link)i.append(link('Saiba mais',a.link));if(a.visivel==='membros'){i.append(document.createTextNode(' '),el('span','badge','membros'))}return i}));BL.anuncios=s}
  // agenda
  const ag=site.agenda||[];
  if(ag.length){const s=secao('Agenda',ag.length+(ag.length===1?' evento':' eventos'));s.id='sec-agenda';lembrar(s,'agenda',true);
    s.append(porPeso(ag,e=>{const [y,m,dd]=e.data.split('-');const dt=new Date(+y,+m-1,+dd);const i=el('div','item agitem');
      const b=el('div','data',`${dd}/${m}`);b.append(el('small','',DIAS[dt.getDay()]));const t=el('div');t.style.flex='1';
      t.append(el('b','',e.titulo));const q=[e.hora,e.local].filter(Boolean).join(' · ');if(q){t.append(el('br'),el('small','',q))}
      if(e.link){t.append(el('br'),link('Mais informações',e.link))}i.append(b,t);if(e.visivel==='membros')i.append(el('span','badge','membros'));return i}));BL.agenda=s}
  // vitrine (redes e embeds)
  const vt=site.vitrine||[];
  if(vt.length){const s=secao('Vitrine da liga',vt.length+(vt.length===1?' destaque':' destaques'));s.id='sec-vitrine';lembrar(s,'vitrine',true);
    s.append(porPeso(vt,v=>LigaVitrine.render(v),'vit'));BL.vitrine=s}
  // aulas: a lista completa fica em /aulas (níveis recolhidos); aqui só o atalho
  const sa=el('div','');sa.id='sec-aulas';const ca=el('a','aula');ca.href='/aulas';const na=el('div');na.style.flex='1';
  na.append(el('b','','Aulas'),el('br'),el('small','',d.aulas.length?d.aulas.length+(d.aulas.length===1?' aula disponível para você':' aulas disponíveis para você'):(d.usuario?'Nenhuma aula liberada para você ainda.':'Nenhuma aula pública no momento.')));ca.append(na,el('span','badge','abrir'));sa.append(ca);
  if(d.exigeLogin){const p=el('p','',`Há ${d.exigeLogin} aula(s) só para membros. `);const a=el('a','','Entre com o GitHub');a.href='/api/login';p.append(a,document.createTextNode(' para ver.'));sa.append(p)}
  BL.aulas=sa;organizar();
  if(d.usuario)fetch('/api/presenca?acao=minha').then(r=>r.ok?r.json():null).then(m=>{
    if(!m||!m.sessoes.length)return;const ok=m.sessoes.filter(x=>x.status==='presente').length,pts=m.sessoes.reduce((t,x)=>t+x.pontos,0);
    const s=secao('Minha presença',`${ok} de ${m.sessoes.length} aula(s) · ${pts} ponto(s)`);s.id='sec-presenca';lembrar(s,'presenca',false);
    const ST={presente:'Presente',ausente:'Falta',justificado:'Justificado','sem-chamada':'Sem chamada'};
    for(const x of m.sessoes){const i=el('div','item');i.append(el('b','',x.titulo),el('br'),el('small','',`${x.data?x.data.split('-').reverse().join('/')+' · ':''}turma ${x.turma} · ${ST[x.status]||x.status} (${x.presencas}/${x.salvas} chamadas)${x.pontos?' · '+x.pontos+' ponto(s) de participação':''}`));
      for(const p of x.participacoes)i.append(el('br'),el('small','','• '+p.tipo+(p.nota?': '+p.nota:'')));s.append(i)}
    BL.presenca=s;organizar();
    const at=document.getElementById('atalhos');if(at){const b=el('button','btn sec','Minha presença');b.type='button';b.onclick=()=>{s.open=true;s.scrollIntoView({behavior:'smooth',block:'start'})};at.append(b)}
  }).catch(()=>{});
  if(d.usuario)fetch('/api/presenca?acao=minhapontuacao').then(r=>r.ok?r.json():null).then(m=>{
    if(!m||!m.turmas.length)return;
    const s=secao('Minha pontuação',m.turmas.map(t=>`${t.nome}: ${t.total} pts · ${t.posicao}º de ${t.de}`).join(' | '));s.id='sec-pontos';lembrar(s,'pontos',true);
    for(const t of m.turmas){const i=el('div','item');i.append(el('b','',t.nome+(t.status==='arquivada'?' (encerrada)':'')),el('br'),
      el('small','',`Presença ${t.partes.presenca} · Participação ${t.partes.participacao} · Exercícios ${t.partes.exercicios}${t.partes.penalidades?' · Penalidades −'+t.partes.penalidades:''} = ${t.total}`));
      if(t.top5.length){i.append(el('br'),el('small','','Top 5 da turma:'));for(const x of t.top5){i.append(el('br'),el('small','',`${x.posicao}º @${x.usuario} · ${x.total} pts`+(x.usuario===d.usuario?' (você)':'')))}}
      s.append(i)}
    BL.pontos=s;organizar();
  }).catch(()=>{});
  if(d.usuario)fetch('/api/presenca?acao=minhasatividades').then(r=>r.ok?r.json():null).then(m=>{
    if(!m||!m.atividades.length)return;
    const pend=m.atividades.filter(x=>!x.estado||x.estado==='nao').length;
    const s=secao('Minhas atividades',`${m.atividades.length} liberada(s) · ${pend} sem entrega registrada`);s.id='sec-ativ';lembrar(s,'ativ',true);
    const ST={prazo:'Entregue no prazo',atraso:'Entregue com atraso',nao:'Sem entrega registrada',dispensado:'Dispensado'};
    for(const x of m.atividades){const i=el('div','item');i.append(el('b','',(x.codigo?x.codigo+' · ':'')+x.titulo+(x.opcional?' (OPCIONAL, pontos extras)':'')),el('br'),
      el('small','',`${x.prazo?'prazo '+new Date(x.prazo).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+' · ':''}${x.opcional?'opcional':'peso '+x.peso} · ${ST[x.estado]||ST.nao}${x.nota!==null?' · nota '+x.nota:''}`));
      if(x.issue){i.append(el('br'));const a=el('a','','Abrir a atividade e responder (Issue no GitHub)');a.href=x.issue;a.target='_blank';a.rel='noopener';i.append(a)}s.append(i)}
    BL.ativ=s;organizar();
  }).catch(()=>{});
  // atalhos fixos no topo: Aulas sempre em primeiro e em destaque
  const at=document.getElementById('atalhos');at.hidden=false;
  for(const [id,t,pri] of [['sec-aulas','Aulas',true],['sec-anuncios','Anúncios'],['sec-agenda','Agenda']]){const alvo=document.getElementById(id);if(!alvo)continue;
    const b=el('button','btn'+(pri?'':' sec'),t);b.type='button';b.onclick=()=>{if(id==='sec-aulas'){location.href='/aulas';return}alvo.open=true;alvo.scrollIntoView({behavior:'smooth',block:'start'})};at.append(b)}
}).catch(()=>{document.getElementById('corpo').textContent='Não consegui carregar. Recarregue a página.'});
</script></body></html>
